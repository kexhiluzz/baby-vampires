      let mx=0,mz=0;
      if(keys["w"])mz+=1;if(keys["s"])mz-=1;if(keys["a"])mx-=1;if(keys["d"])mx+=1;
      const moving=!!(mx||mz);
      if(moving&&me.drinking<=0){
        const L=Math.hypot(mx,mz);mx/=L;mz/=L;
        const sy=Math.sin(me.yaw),cy=Math.cos(me.yaw);
        let sp=G.sp;if(!grounded)sp*=.8;
        const dx=(mz*sy-mx*cy)*sp*dt,dz=(mz*cy+mx*sy)*sp*dt;
        if(!blocked(me.x+dx,me.z,me.y))me.x+=dx;
        if(!blocked(me.x,me.z+dz,me.y))me.z+=dz;
        if(grounded){
          stepAcc+=Math.hypot(dx,dz);
          const rr=roomAt(me.x,me.z,me.y),nm=nookMuffle(me.x,me.y,me.z),fv=(rr?rr.floor.v:1)*nm;
          if(stepAcc>G.stride){stepAcc=0;
            noiseB(.09,G.vol*fv,G.cut);
            ev({kind:"step",x:me.x,y:me.y+.15,z:me.z,b:gait,q:fv});}
        }
      }
      depenetrate();
      const gUp=groundAt(me.x,me.z,me.y+.55);
      if(vy<=0&&gUp>me.y+.001&&gUp-me.y<=.55){me.y=gUp;vy=0;grounded=true;}
      else{vy-=17*dt;me.y+=vy*dt;
        const gD=groundAt(me.x,me.z,me.y+.06);
        if(me.y<=gD&&vy<=0){
          if(vy<-4.6){noiseB(.14,.55,1200);ev({kind:"step",x:me.x,y:me.y+.15,z:me.z,b:0,land:1});}
          me.y=gD;vy=0;grounded=true;}
        else grounded=false;}
      // munición
      for(let i=0;i<ammoSpots.length;i++){const a=ammoSpots[i];
        if(a.taken>t)continue;
        if(Math.hypot(a.x-me.x,a.z-me.z)<.9&&Math.abs(a.y-me.y)<1.5){
          if(me.ammo>=MAX_AMMO)continue;
          a.taken=t+25;me.ammo=Math.min(MAX_AMMO,me.ammo+1);drawAmmo();flash("Una bala más","good");}}
      // beber
      const corpse=nearCorpse();
      if(corpse>=0&&keys["e"]){
        me.drinking+=dtr;
        if(Math.floor(me.drinking*2)!==Math.floor((me.drinking-dt)*2))
          ev({kind:"drink",x:me.x,y:me.y+.6,z:me.z});
        if(me.drinking>=DRINK_SECS){
          me.drinking=0;
          // el anfitrión se lo apunta solo si el cordero sigue entero: nadie bebe dos veces
          if(isHost)resolveClaim({k:"lamb",by:myId,i:corpse},myId);
          else{ if(lambs[corpse])lambs[corpse].drained=true;
                me.lambs++;send({t:"claim",k:"lamb",by:myId,i:corpse}); }
          flash("Has bebido · "+me.lambs+" de "+LAMBS_TO_WIN,"good");
          drawBoard();}
      } else me.drinking=0;
      // puertas
      const nd=nearDoor(),pr=el("prompt");
      if(corpse>=0){pr.textContent="E · beber ("+(DRINK_SECS-me.drinking).toFixed(1)+" s)";pr.className="prompt on";}
      else if(nd){pr.textContent="E · "+(nd.open?"cerrar":"abrir");pr.className="prompt on";}
      else pr.className="prompt";
      if(keys["e"]&&corpse<0&&nd&&!keys._dl){keys._dl=true;toggleDoor();}
      if(!keys["e"])keys._dl=false;
      // carga del pulso
      if(pulseHeld){pulseCharge=Math.min(1,pulseCharge+dtr*0.75);}
      if(pulseCD>0)pulseCD=Math.max(0,pulseCD-dtr);
      if(shotCD>0)shotCD=Math.max(0,shotCD-dtr);
    }
    // corderos: el anfitrión los mueve y los hace balar
    if(testMode)tickNPCs(dt,t);
    if(isHost){
      hostTickLambs(dt);
      if(t>lambNext){lambNext=t+.2;hostLambs();}
      for(let i=0;i<lambs.length;i++){const L=lambs[i];
        if(!L.alive)continue;
        if(!L.next||t>L.next){L.next=t+1.9+Math.random()*2.4;
          send({t:"ev",kind:"bleat",x:L.x,y:L.y,z:L.z});
          remoteEvent({kind:"bleat",x:L.x,y:L.y,z:L.z});}}
      if(t>scNext){scNext=t+1.0;hostScores();}
    }
    // latido de los corderos vivos: constante, para todos
    for(let i=0;i<lambs.length;i++){const L=lambs[i];
      if(!L||!L.alive)continue;
      if(!L.hb||t>L.hb){L.hb=t+1.15;
        worldSound(L.x,L.y+.5,L.z,function(D){tone(62,.14,.5,"sine",D);tone(48,.2,.35,"sine",D,.17);});}
      if(L.mesh){L.mesh.position.set(L.x,L.y,L.z);}}
    // corriente de aire en los vanos: así sabes que hay salida sin verla
    if(AC){
      const fld=F[floorOf(me.y)];
      for(let i=0;i<fld.doors.length;i++){const d=fld.doors[i];
        const dd=Math.hypot(d.x-me.x,d.z-me.z);
        if(dd>8)continue;
        if(!d.air||t>d.air){d.air=t+2.2+Math.random()*1.6;
          worldSound(d.x,me.y+1.2,d.z,function(D){
            if(d.open)noiseB(.75,.055,520,D);
            else{noiseB(.5,.022,240,D);}});}}
      // los escotillones tiran aire entre plantas: suenan desde arriba y desde abajo
      for(let i=0;i<trapdoors.length;i++){const tp=trapdoors[i];
        const td=Math.hypot(tp.x-me.x,tp.z-me.z);
        if(td>9)continue;
        if(!tp.air||t>tp.air){tp.air=t+2.6+Math.random()*1.8;
          worldSound(tp.x,FLOOR_H-.15,tp.z,function(D){
            if(tp.sp){tone(140,.12,.07,"triangle",D);noiseB(.3,.03,900,D,.09);}
            else{noiseB(1.1,.055,300,D);tone(96,.45,.05,"sine",D,.1);}});}}
    }
    // anclas
    if(AC)for(let f=0;f<2;f++){const an=F[f].anchors;
      for(let i=0;i<an.length;i++){const a=an[i];
        if(t>a.next){
          a.next=t+(AGAP[a.kind]||2.5)*(.85+Math.random()*.3);
          // la casa tiene casi cuarenta focos de ambiente: solo se calculan los de cerca
          const adx=a.x-me.x,adz=a.z-me.z;
          if(adx*adx+adz*adz>26*26)continue;
          worldSound(a.x,a.y,a.z,function(D){
            if(a.kind==="goteo")tone(1250,.045,.16,"sine",D);
            else if(a.kind==="corriente")noiseB(.8,.05,380,D);
            else if(a.kind==="reloj"){tone(430,.08,.18,"triangle",D);tone(160,.16,.14,"sine",D);}
            else if(a.kind==="crujido")noiseB(.25,.07,520,D);
            else if(a.kind==="viento")noiseB(.9,.05,420,D);
            else if(a.kind==="cañería")tone(88,.5,.10,"sine",D);
            else if(a.kind==="ratas")noiseB(.12,.06,2600,D);
            else tone(300,.4,.09,"sine",D);});
          addEchoHeard(a.x,a.y,a.z,.26,2.8);}}}
    // puertas animadas
    for(let f=0;f<2;f++)for(let i=0;i<F[f].doors.length;i++){
      const d=F[f].doors[i];if(!d.mesh)continue;
      const tg=d.open?(d.baseRot-Math.PI*.52):d.baseRot;
      d.mesh.rotation.y+=(tg-d.mesh.rotation.y)*Math.min(1,dt*7);
      if(d.mesh2){const t2=d.open?(d.baseRot2+Math.PI*.52):d.baseRot2;
        d.mesh2.rotation.y+=(t2-d.mesh2.rotation.y)*Math.min(1,dt*7);}}
    // la memoria se apaga poco a poco
    if(t>memNext){memNext=t+MEM_TICK;decayMemory();}
    bodyTick(t,dtr,!!(keys["w"]||keys["a"]||keys["s"]||keys["d"]));
    // red
    if(t>netNext){netNext=t+1/15;
      send({t:"s",id:myId,x:me.x,y:me.y,z:me.z,yaw:me.yaw,d:me.dead,cr:crouch?1:0,g:me.gait|0,
            mv:!!(keys["w"]||keys["a"]||keys["s"]||keys["d"])});}
    // HUD
    let vid="";for(let v=0;v<LIVES;v++)vid+=(v<me.lives?"<b class='blood'>●</b>":"<span style='opacity:.3'>●</span>");
    el("scoreTag").innerHTML="Sangre <b class='blood'>"+me.lambs+"</b> de "+LAMBS_TO_WIN+
      "<br>Cuerpos "+vid;
    el("hintL").innerHTML=me.dead?"Vuelves en <b>"+Math.max(0,me.respawnAt-t).toFixed(1)+"</b>":
      (nookMuffle(me.x,me.y,me.z)<1?"Entre cortinajes <b>·</b> tus pasos apenas suenan":
       (crouch?(nearCover()?"Agachado <b>·</b> a cubierto":"Agachado"):(keys["shift"]?"Despacio":"")));
    el("hintR").innerHTML="Planta <b>"+(floorOf(me.y)===0?"baja":"1ª")+"</b>"+
      (pulseCD>0?"<br>Garganta <b>"+pulseCD.toFixed(1)+"</b>":"");
    const P=PULSE[pulseLevel()];
    {const cr2=el("cross");if(cr2)cr2.style.opacity=(shotCD>0?0.28:(me.ammo>0?1:0.45));}
    el("pulseUI").className="pulse"+(pulseHeld?" on":"");
    el("pulseFill").style.width=(pulseCharge*100).toFixed(0)+"%";
    el("pulseInt").textContent=P.n;
    el("pulseApt").textContent=Math.round(40+pulseAperture*280)+"°";
    el("cone").setAttribute("class","cone"+(pulseHeld?" on":""));
    const half=(40+pulseAperture*280)/2*Math.PI/180, rr=110;
    el("conePath").setAttribute("d",
      "M130,130 L"+(130+Math.sin(-half)*rr).toFixed(1)+","+(130-Math.cos(-half)*rr).toFixed(1)+
      " A"+rr+","+rr+" 0 "+(half>Math.PI/2?1:0)+" 1 "+
      (130+Math.sin(half)*rr).toFixed(1)+","+(130-Math.cos(half)*rr).toFixed(1)+" Z");
    el("clock").textContent=dbgOn
      ? (Math.round(fps)+" fps · calidad "+QUALITY.toFixed(2)+" · chillidos "+pulseCount+" · ecos "+echoes.length+" · cursor "+(locked()?"capturado":"libre")
         +" · x"+me.x.toFixed(1)+" z"+me.z.toFixed(1)+" y"+me.y.toFixed(1)+" · salas "+(F[0]?F[0].rooms.length:0)
         +(lastErr?"  ⚠ "+lastErr:""))
      : "";
    if(testMode&&t>tpNext){tpNext=t+0.15;
      let h="<b>modo test</b> · cinco maniquíes · ninguno dispara<br>";
      for(let i=0;i<npcs.length;i++){const P=peers[npcs[i].id];if(!P)continue;
        const d=Math.hypot(P.x-me.x,P.z-me.z)+Math.abs(P.y-me.y)*2;
        const mv=(t-(P.lastMove||0)<0.5),g=P.g|0;
        const k=mv?(g===2?0.08:(g===1?0.15:0.52)):(P.cr?0.14:0.30);
        h+="<b>"+P.name+"</b> "+d.toFixed(0)+" m · eco <span class='v'>"+k.toFixed(2)+"</span> · "+
           (P.dead?"caído":(bodySeen(P.x,P.y,P.z,!!P.cr)?(mv?"en marcha":"parado"):"sin línea"))+"<br>";}
      el("tpanel").innerHTML=h;}
  }
  /* Cuánto devuelve un cuerpo ajeno, de más a menos:
       corriendo 0,52 · quieto de pie 0,30 · despacio 0,15
       quieto agachado 0,14 · agachado en movimiento 0,08
     Con 0,15 solo te encuentra un chillido fuerte y de cerca: es un rastro,
     no una silueta. Cuanto más te encoges y más cuidas el paso, menos vuelves. */
  for(const id in peers){const p=peers[id];if(!p.mesh||p.x===undefined)continue;
    p.mesh.position.set(p.x,p.y,p.z);p.mesh.rotation.y=p.yaw||0;
    p.mesh.scale.y=p.cr?.62:1;
    // el cuerpo vivo solo se dibuja si lo tienes encima: más lejos sería una
    // silueta negra recortada contra el muro, que delata igual que una brillante
    const near=Math.hypot(p.x-me.x,p.z-me.z)+Math.abs(p.y-me.y);
    p.mesh.visible=running&&!p.dead&&near<1.35&&bodySeen(p.x,p.y,p.z,!!p.cr);}
  tickPhotos(t);
  for(let i=0;i<lambs.length;i++){const L=lambs[i];
    if(!L||!L.mesh)continue;
    L.mesh.visible=running&&!L.drained;
    if(L.mesh.children)for(let c=0;c<L.mesh.children.length;c++){
      const ch=L.mesh.children[c];
      if(ch.isSprite){
        ch.visible=L.alive||!L.drained;
        const dd=Math.hypot(L.x-me.x,L.z-me.z);
        const kv=Math.max(0,1-(dd/16)*(dd/16)),kc=Math.max(0,1-(dd/11)*(dd/11));
        ch.material.opacity=L.alive?(0.60*kv*(0.78+0.22*Math.sin(t*5.5))):(0.70*kc);
        ch.material.color.setHex(L.alive?0xffffff:0x7A2622);
      } else ch.visible=true;
    }
    // quieto sigue devolviendo eco, solo que más flojo — como los vampiros
    if(L.mesh.userData.mat){
      const k=L.alive?((t-(L.lastMove||0)<0.6)?1:.45):.62;
      L.mesh.userData.mat.uniforms.uTint.value.set(k,k*.94,k*.88);}
    }
  for(let i=0;i<ammoSpots.length;i++){const a=ammoSpots[i];
    const free=running&&a.taken<=t;
    if(a.mesh)a.mesh.visible=free;
    if(a.halo){a.halo.visible=free;
      const dd=Math.hypot(a.x-me.x,a.z-me.z);
      a.halo.material.opacity=0.8*Math.max(0,1-dd/20);}}

  if(AC){const Ls=AC.listener,cp=Math.cos(me.pitch);
    const fx=Math.sin(me.yaw)*cp,fy=Math.sin(me.pitch),fz=Math.cos(me.yaw)*cp;
    if(Ls.forwardX){Ls.positionX.value=me.x;Ls.positionY.value=me.y+eyeH;Ls.positionZ.value=me.z;
      Ls.forwardX.value=fx;Ls.forwardY.value=fy;Ls.forwardZ.value=fz;
      Ls.upX.value=0;Ls.upY.value=1;Ls.upZ.value=0;}
    else{Ls.setPosition(me.x,me.y+eyeH,me.z);Ls.setOrientation(fx,fy,fz,0,1,0);}}
  const eyeTarget=me.dead?0.4:(crouch?EYE_CROUCH:EYE);
  eyeH+=(eyeTarget-eyeH)*Math.min(1,dt*11);
  // el pecho sube y baja, y más si vienes corriendo
  const brSw=(running&&!me.dead)?Math.sin(t*1.9+tension*3.0)*(0.008+tension*0.012):0;
  camera.position.set(me.x,me.y+eyeH+brSw,me.z);
  const cp2=Math.cos(me.pitch);
  camera.lookAt(me.x+Math.sin(me.yaw)*cp2,me.y+eyeH+brSw+Math.sin(me.pitch),me.z+Math.cos(me.yaw)*cp2);

  uni.uTime.value=t;
  for(let i=0;i<MAX_ECHO;i++){const e=echoes[i];
    if(e){uni.uEchoPos.value[i].set(e.x,e.y,e.z);uni.uEchoT.value[i]=e.t;
      uni.uEchoS.value[i]=e.s;uni.uEchoR.value[i]=e.R;
      uni.uEchoC.value[i].set(e.c[0],e.c[1],e.c[2]);}
    else uni.uEchoS.value[i]=0;}
  fitCanvas();
  renderFrame();
}
/* el lienzo solo se redimensiona cuando cambia de verdad.
   antes se reasignaba su tamaño en cada fotograma, y eso obliga al navegador
   a tirar y rehacer el búfer de dibujo sesenta veces por segundo. */
let curW=0,curH=0,curPR=0,QUALITY=2.0;
function fitCanvas(){
  const w=window.innerWidth,h=window.innerHeight;
  const pr=Math.min(window.devicePixelRatio||1,QUALITY);
  if(w===curW&&h===curH&&pr===curPR)return;
  curW=w;curH=h;curPR=pr;
  renderer.setPixelRatio(pr);renderer.setSize(w,h,false);
  camera.aspect=w/h;camera.updateProjectionMatrix();
  initPost();sizePost(Math.floor(w*pr),Math.floor(h*pr));
}
/* y si el ordenador no da para tanto, se baja la resolución sola */
let fpsN=0,fpsT=0,fps=60,qDrop=0;
function watchFps(dt){
  fpsN++;fpsT+=dt;
  if(fpsT<1.5)return;
  fps=fpsN/fpsT;fpsN=0;fpsT=0;
  if(fps<34&&bloomOn&&qDrop>=1){bloomOn=false;}
  if(fps<40&&qDrop<3){qDrop++;QUALITY=[2.0,1.5,1.15,0.85][qDrop];}
  else if(fps>58&&qDrop>0){qDrop--;QUALITY=[2.0,1.5,1.15,0.85][qDrop];}
}
window.addEventListener("beforeunload",function(e){
  if(running){ e.preventDefault(); e.returnValue=""; }
});

/* ══════════ la entrada: el título que aparece a golpe de ultrasonido ══════════ */
function playIntro(){
  const ov=el("intro"),cvx=el("introCv"),hint=el("introHint");
  if(!ov||!cvx)return;
  const cx=cvx.getContext("2d");
  const TITLE="BABY VAMPIRES";
  const RED_AT=6;                       // la A de VAMPIRES
  let DPR=1,W=0,H=0,box=null,glyphs=[],started=0,done=false,raf=0;
  const WAVES=[{t:0.05,sp:700,reach:0.42,glow:2.6,a:0.52},
               {t:0.80,sp:900,reach:0.74,glow:2.6,a:0.76},
               {t:1.70,sp:1250,reach:1.10,glow:2.8,a:1.00}];
  const RED_T=2.75,END_T=4.6;
  const tmp=document.createElement("canvas"),tc=tmp.getContext("2d");
  const txt=document.createElement("canvas"),xc=txt.getContext("2d");
  function FONT(){return "700 "+box.fs+"px "+getComputedStyle(document.body).getPropertyValue("--disp").trim();}
  function layout(){
    DPR=Math.min(2,window.devicePixelRatio||1);
    W=window.innerWidth;H=window.innerHeight;
    cvx.width=Math.round(W*DPR);cvx.height=Math.round(H*DPR);
    // el título se mide primero y luego se escala: así cabe también en un móvil
    box={fs:100};xc.font=FONT();
    let unit=0;
    for(let i=0;i<TITLE.length;i++){const c=TITLE[i];
      unit+=(c===" "?36:xc.measureText(c).width)+16;}
    unit=(unit-16)/100;                       // anchura del título por píxel de cuerpo
    const fs=Math.max(17,Math.min(92,Math.min(W*0.84/unit,H*0.30)));
    const sp=fs*0.16;
    box={fs:fs};
    xc.font=FONT();
    let tw=0;const wid=[];
    for(let i=0;i<TITLE.length;i++){const c=TITLE[i];
      const w=c===" "?fs*0.36:xc.measureText(c).width;wid.push(w);tw+=w+sp;}
    tw-=sp;
    const pad=Math.min(fs*1.5,(W-tw)/2-2);
    box.w=Math.ceil(tw+pad*2);box.h=Math.ceil(fs*2.8);
    box.x=Math.round(W/2-box.w/2);box.y=Math.round(H/2-box.h/2);
    txt.width=tmp.width=Math.round(box.w*DPR);txt.height=tmp.height=Math.round(box.h*DPR);
    xc.setTransform(DPR,0,0,DPR,0,0);tc.setTransform(DPR,0,0,DPR,0,0);
    xc.clearRect(0,0,box.w,box.h);
    xc.font=FONT();xc.textBaseline="middle";xc.fillStyle="#fff";
    glyphs=[];let x=pad;
    for(let i=0;i<TITLE.length;i++){const c=TITLE[i];
      if(c!==" ")xc.fillText(c,x,box.h/2);
      glyphs.push({c:c,x:x,w:wid[i]});x+=wid[i]+sp;}
  }
  function grad(g,maxR,r,reach,a0,aF){
    const pF=Math.max(0,Math.min(1,Math.min(r,reach)/maxR));
    const st=[[0,a0],[Math.max(0,pF-0.02),a0],[Math.max(0,pF-0.008),aF],[Math.min(1,pF+0.006),0],[1,0]];
    let last=-1;
    for(let i=0;i<st.length;i++){let o=Math.max(0,Math.min(1,st[i][0]));
      if(o<=last)o=Math.min(1,last+0.0004);last=o;
      g.addColorStop(o,"rgba(240,233,219,"+Math.max(0,Math.min(1,st[i][1])).toFixed(3)+")");}
  }
  function draw(now){
    const t=(now-started)/1000;
    cx.setTransform(1,0,0,1,0,0);
    cx.fillStyle="#07080a";cx.fillRect(0,0,cvx.width,cvx.height);
    cx.setTransform(DPR,0,0,DPR,0,0);
    const ox=box.w/2,oy=box.h/2;
    const maxR=Math.hypot(box.w/2,box.h/2)*1.02;
    // lo que cada chillido deja grabado: la memoria del título
    let mem=0;
    for(let i=0;i<WAVES.length;i++)
      if(t>WAVES[i].t)mem+=0.062*Math.min(1,(t-WAVES[i].t)/0.7);
    mem=Math.min(0.19,mem);
    if(mem>0.001){
      cx.globalCompositeOperation="lighter";cx.globalAlpha=mem;
      cx.drawImage(txt,box.x,box.y,box.w,box.h);
      cx.globalAlpha=1;cx.globalCompositeOperation="source-over";
    }
    // y el frente de cada chillido barriendo las letras
    for(let i=0;i<WAVES.length;i++){const wv=WAVES[i],age=t-wv.t;
      if(age<=0)continue;
      const reach=maxR*wv.reach,r=age*wv.sp;
      const fade=Math.max(0,1-age/wv.glow);
      const front=Math.max(0,1-Math.max(0,r-reach)/150);
      if(fade<=0&&front<=0)continue;
      tc.setTransform(1,0,0,1,0,0);tc.clearRect(0,0,tmp.width,tmp.height);
      tc.setTransform(DPR,0,0,DPR,0,0);
      tc.drawImage(txt,0,0,box.w,box.h);
      tc.globalCompositeOperation="source-in";
      const g=tc.createRadialGradient(ox,oy,0,ox,oy,maxR);
      grad(g,maxR,r,reach,0.26*wv.a*fade,1.1*wv.a*front);
      tc.fillStyle=g;tc.fillRect(0,0,box.w,box.h);
      tc.globalCompositeOperation="source-over";
      cx.globalCompositeOperation="lighter";
      cx.drawImage(tmp,box.x,box.y,box.w,box.h);
      cx.globalCompositeOperation="source-over";
    }
    // al final, la A se enciende con el rojo de los corderos
    if(t>RED_T){
      const a=t-RED_T,gl=glyphs[RED_AT];
      const k=Math.min(1,a/0.6),pulse=0.74+0.26*Math.sin(a*5.0);
      const gx=box.x+gl.x+gl.w/2,gy=box.y+box.h/2;
      const rr=box.fs*(1.0+1.6*k);
      const g2=cx.createRadialGradient(gx,gy,1,gx,gy,rr);
      g2.addColorStop(0,"rgba(198,58,52,"+(0.55*k*pulse).toFixed(3)+")");
      g2.addColorStop(0.40,"rgba(184,65,60,"+(0.19*k*pulse).toFixed(3)+")");
      g2.addColorStop(1,"rgba(184,65,60,0)");
      cx.globalCompositeOperation="lighter";
      cx.fillStyle=g2;cx.fillRect(gx-rr,gy-rr,rr*2,rr*2);
      cx.font=FONT();cx.textBaseline="middle";
      cx.fillStyle="rgba(206,58,52,"+(1.0*k*pulse).toFixed(3)+")";
      cx.fillText(gl.c,box.x+gl.x,gy);
      cx.globalCompositeOperation="source-over";
    }
    if(t>END_T)finish();else raf=requestAnimationFrame(draw);
  }
  function chirp(f,vol){
    if(!AC)return;
    const o=AC.createOscillator(),g=AC.createGain();
    o.type="sawtooth";
    o.frequency.setValueAtTime(f*1.7,AC.currentTime);
    o.frequency.exponentialRampToValueAtTime(f*0.7,AC.currentTime+.11);
    g.gain.setValueAtTime(.0001,AC.currentTime);
    g.gain.exponentialRampToValueAtTime(vol,AC.currentTime+.008);
    g.gain.exponentialRampToValueAtTime(.0001,AC.currentTime+.15);
    o.connect(g);g.connect(master);o.start();o.stop(AC.currentTime+.18);
  }
  function finish(){
    if(done)return;done=true;
    if(raf)cancelAnimationFrame(raf);
    ov.classList.add("gone");
    setTimeout(function(){ov.style.display="none";},650);
    window.removeEventListener("resize",layout);
  }
  function begin(){
    if(started)return;
    try{initAudio();if(AC&&AC.state==="suspended")AC.resume();}catch(e){}
    hint.style.display="none";
    started=performance.now();
    for(let i=0;i<WAVES.length;i++)
      setTimeout(chirp.bind(null,[2400,1700,1150][i],[.09,.16,.26][i]),WAVES[i].t*1000);
    setTimeout(function(){ if(!AC)return;
      tone(62,.16,.30,"sine");tone(48,.24,.20,"sine",null,.18);},RED_T*1000+80);
    setTimeout(function(){ if(!AC)return;
      tone(58,.18,.22,"sine");tone(44,.26,.14,"sine",null,.19);},RED_T*1000+900);
    raf=requestAnimationFrame(draw);
  }
  layout();
  window.addEventListener("resize",layout);
  // el título, apagado, esperando el primer chillido
  cx.setTransform(1,0,0,1,0,0);cx.fillStyle="#07080a";cx.fillRect(0,0,cvx.width,cvx.height);
  cx.setTransform(DPR,0,0,DPR,0,0);
  cx.globalAlpha=.07;cx.drawImage(txt,box.x,box.y,box.w,box.h);cx.globalAlpha=1;
  ov.addEventListener("pointerdown",function(){ if(!started)begin(); else finish(); });
  window.addEventListener("keydown",function(e){ if(!done&&(e.key==="Escape"||e.key===" ")){ if(!started)begin();else finish(); } });
}

{const v=el("ver");if(v)v.textContent=VERSION;}
renderEntry();
let introGo=false;
function bootIntro(){ if(introGo)return;introGo=true;
  try{ playIntro(); }catch(e){ const iv=el("intro"); if(iv)iv.style.display="none"; } }
try{ if(document.fonts&&document.fonts.ready)document.fonts.ready.then(bootIntro); }catch(e){}
setTimeout(bootIntro,1100);
requestAnimationFrame(frame);
})();
</script>
