<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Baby Vampires</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/peerjs/1.5.4/peerjs.min.js"></script>
<style>
:root{--ink:#06070C;--ink2:#0C0E16;--ink3:#12141F;--line:#1D2030;--bone:#E6E1D6;--dim:#787D8C;
--dimmer:#4A4E5E;--blood:#B8413C;--ember:#D98A46;--cold:#6E8FD1;--mint:#6FC3A6;
--mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;--disp:"Bricolage Grotesque",Arial,sans-serif}
*{box-sizing:border-box}html,body{height:100%}
body{background:var(--ink);color:var(--bone);font-family:var(--mono);margin:0;overflow:hidden}
canvas#cv{display:block;width:100vw;height:100vh}
.hud{position:fixed;inset:0;pointer-events:none;padding:16px 20px;display:flex;flex-direction:column;justify-content:space-between}
.row{display:flex;justify-content:space-between;align-items:flex-start;gap:20px}
.tag{font-size:10.5px;letter-spacing:.15em;text-transform:uppercase;color:var(--dimmer);line-height:1.85}
.tag b{font-family:var(--disp);font-size:17px;letter-spacing:-.01em;color:var(--bone)}
.tag.right{text-align:right}
.tag .blood{color:var(--blood)}
.mid{align-self:center;text-align:center}
.clock{font-family:var(--disp);font-size:24px;color:var(--dim);font-variant-numeric:tabular-nums}
.prompt{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--ember);opacity:0;transition:opacity .15s;margin-top:6px}
.prompt.on{opacity:1}
.flash{align-self:center;font-family:var(--disp);font-size:clamp(19px,2.8vw,28px);opacity:0;transition:opacity .2s;text-align:center}
.flash.on{opacity:1}.flash.good{color:var(--mint)}.flash.bad{color:var(--blood)}
.ammo{display:flex;gap:4px;justify-content:flex-end;margin-top:6px}
.shell{width:4px;height:14px;background:var(--ember);border-radius:1px}
.shell.spent{background:transparent;border:1px solid var(--dimmer)}
.cross{position:fixed;left:50%;top:50%;width:20px;height:20px;transform:translate(-50%,-50%);pointer-events:none}
.cross::before,.cross::after{content:"";position:absolute;background:rgba(230,225,214,.34)}
.cross::before{left:50%;top:0;width:1.4px;height:5px;transform:translateX(-50%);box-shadow:0 15px 0 rgba(230,225,214,.34)}
.cross::after{top:50%;left:0;height:1.4px;width:5px;transform:translateY(-50%);box-shadow:15px 0 0 rgba(230,225,214,.34)}
/* medidor del pulso */
.pulse{position:fixed;left:50%;bottom:13%;transform:translateX(-50%);width:230px;pointer-events:none;opacity:.001;transition:opacity .12s}
.pulse.on{opacity:1}
.pulse .bar{height:4px;background:var(--ink3);border:1px solid var(--line);position:relative;overflow:hidden}
.pulse .fill{position:absolute;inset:0;width:0;background:var(--ember)}
.pulse .lab{display:flex;justify-content:space-between;font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--dimmer);margin-top:6px}
.pulse .lab b{color:var(--bone);font-weight:500}
.cone{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);pointer-events:none;opacity:0;transition:opacity .12s}
.cone.on{opacity:.5}
.lockhint{position:fixed;left:50%;bottom:20%;transform:translateX(-50%);font-size:12px;letter-spacing:.18em;
  text-transform:uppercase;color:var(--bone);background:rgba(8,9,14,.82);border:1px solid var(--line);
  padding:9px 16px;border-radius:3px;pointer-events:none;display:none;animation:lh 1.8s ease-in-out infinite}
@keyframes lh{0%,100%{opacity:.55}50%{opacity:1}}
.lockhint.on{display:block}
.board{position:fixed;right:20px;top:60px;font-size:11.5px;line-height:1.95;color:var(--dim);text-align:right;pointer-events:none}
.board .me{color:var(--bone)}
.tpanel{position:fixed;left:20px;top:150px;font-size:11px;line-height:1.9;color:var(--dim);
  letter-spacing:.055em;pointer-events:none;display:none;text-transform:uppercase}
.tpanel.on{display:block}
.tpanel b{color:var(--bone);font-weight:500}
.tpanel .v{color:var(--amber,#D98A46)}
.intro{position:fixed;inset:0;background:#07080a;z-index:40;cursor:pointer;transition:opacity .55s ease}
.intro.gone{opacity:0;pointer-events:none}
.intro canvas{display:block;width:100%;height:100%}
.introHint{position:absolute;left:50%;bottom:16%;transform:translateX(-50%);font-size:10.5px;
  letter-spacing:.24em;text-transform:uppercase;color:#3a3f4d;animation:lat 2.4s ease-in-out infinite}
@keyframes lat{0%,100%{opacity:.35}50%{opacity:.9}}
.ver{position:fixed;left:20px;top:78px;z-index:6;font-size:9.5px;letter-spacing:.2em;
  text-transform:uppercase;color:var(--dimmer);pointer-events:none;opacity:.7}
.veil{position:fixed;inset:0;background:rgba(3,4,8,.97);display:flex;align-items:center;justify-content:center;padding:24px;overflow:auto;z-index:5}
.veil.gone{display:none}
.card{max-width:660px;width:100%}
.card h1{font-family:var(--disp);font-size:clamp(28px,5vw,44px);font-weight:700;letter-spacing:-.02em;margin:0 0 4px}
.card .sub{color:var(--dim);font-size:13px;line-height:1.65;margin:0 0 18px}
.split{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin:18px 0}
@media(max-width:600px){.split{grid-template-columns:1fr}}
.box{border:1px solid var(--line);background:var(--ink2);padding:16px}
.box h2{font-size:10.5px;letter-spacing:.15em;text-transform:uppercase;color:var(--dimmer);margin:0 0 12px;font-weight:500}
input[type=text]{font-family:var(--mono);width:100%;background:var(--ink3);border:1px solid var(--line);color:var(--bone);padding:9px 11px;font-size:15px;letter-spacing:.2em;text-transform:uppercase;border-radius:2px;margin-bottom:10px}
input[type=text]:focus{outline:none;border-color:var(--blood)}
input[type=range]{width:100%;accent-color:var(--blood)}
button{font-family:var(--mono);font-size:11.5px;letter-spacing:.1em;text-transform:uppercase;background:var(--blood);color:#170606;border:0;border-radius:2px;padding:10px 16px;cursor:pointer;font-weight:600;width:100%}
button:hover{filter:brightness(1.1)}button:disabled{opacity:.4;cursor:default}
button.ghost{background:transparent;color:var(--dim);border:1px solid var(--line)}
button.ghost:hover{color:var(--bone);border-color:var(--dim);filter:none}
.code{font-family:var(--disp);font-size:38px;font-weight:700;letter-spacing:.16em;color:var(--blood);margin:2px 0 10px}
.status{font-size:11.5px;color:var(--dimmer);line-height:1.7;margin-top:12px}
.status.err{color:var(--blood);font-size:13px;border-left:2px solid var(--blood);padding-left:10px}
.status.good{color:var(--mint)}
.who{display:flex;flex-direction:column;gap:7px;margin:10px 0 0;font-size:13px}
.who>div{display:flex;align-items:center;gap:9px;color:var(--bone)}
.who .dot{width:7px;height:7px;border-radius:50%;background:var(--mint);flex:none}
.who .dot.off{background:var(--dimmer)}
.who .rol{margin-left:auto;font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--dimmer)}
.empty{font-size:12.5px;color:var(--ember);line-height:1.7;margin:10px 0 0}
.inv{display:flex;gap:8px;align-items:center;margin-top:2px}
.inv button{margin:0}
.rules{border-left:2px solid var(--blood);padding-left:14px;margin:18px 0}
.rules p{margin:0 0 9px;font-size:13px;line-height:1.6;color:var(--dim)}
.rules b{color:var(--bone)}
.keys{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:12px;color:var(--dim);margin:14px 0 0}
.keys kbd{font-family:var(--mono);font-size:10.5px;background:var(--ink3);border:1px solid var(--line);border-radius:3px;padding:2px 7px;color:var(--bone);justify-self:start;white-space:nowrap}
.sens{display:flex;align-items:center;gap:12px;margin-top:14px;font-size:11.5px;color:var(--dimmer)}
.final{font-size:13px;line-height:2;color:var(--dim);margin:10px 0 0}
.final b{color:var(--bone)}
</style>
</head>
<body>
<canvas id="cv"></canvas>
<div class="cross" id="cross"></div>
<div class="lockhint" id="lockhint">Haz clic para capturar el ratón</div>
<svg class="cone" id="cone" width="260" height="260" viewBox="0 0 260 260"><path id="conePath" fill="none" stroke="#D98A46" stroke-width="1.2"/></svg>
<div class="pulse" id="pulseUI">
  <div class="bar"><div class="fill" id="pulseFill"></div></div>
  <div class="lab"><span>Intensidad <b id="pulseInt">susurro</b></span><span>Apertura <b id="pulseApt">90°</b></span></div>
</div>
<div class="board" id="board"></div>
<div class="tpanel" id="tpanel"></div>
<div class="hud">
  <div class="row"><div class="tag" id="scoreTag"></div><div class="tag right" id="rightTag"><div class="ammo" id="ammo"></div></div></div>
  <div class="mid"><div class="clock" id="clock"></div><div class="prompt" id="prompt"></div></div>
  <div class="flash" id="flash"></div>
  <div class="row"><div class="tag" id="hintL"></div><div class="tag right" id="hintR"></div></div>
</div>
<!-- Baby Vampires · v9 · 15 sep -->
<div class="ver" id="ver"></div>
<div class="veil" id="veil"><div class="card" id="card"></div></div>
<div class="intro" id="intro"><canvas id="introCv"></canvas><div class="introHint" id="introHint">haz clic para entrar</div></div>

<script>
(function(){
"use strict";
function mulberry(a){return function(){a|=0;a=a+0x6D2B79F5|0;
  var t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;
  return ((t^t>>>14)>>>0)/4294967296;};}
let R=Math.random;
function ri(a,b){return a+Math.floor(R()*(b-a+1));}
function rf(a,b){return a+R()*(b-a);}
function now(){return performance.now()/1000;}
function el(id){return document.getElementById(id);}
function clamp(v,a,b){return v<a?a:(v>b?b:v);}

/* ══════════ constantes ══════════ */
const MW=48,MH=36,WALL_T=.22,FLOOR_H=4.0,SLAB_T=.35,WALL_H=FLOOR_H-SLAB_T,DOOR_W=1.5;
const EYE=1.62,EYE_CROUCH=1.02,RAD=.32,JUMP_V=6.0;
const MAX_ECHO=14,ECHO_SPEED=8.2,AFTERGLOW=1.6;
const MEM_TICK=0.25, MEM_FADE=16;   // segundos hasta olvidar del todo
const SOUND_MS=343;                    // velocidad del sonido, para los retornos
const VERSION="v27 · 16 sep";         // sube con cada cambio que pides: así sabes qué juegas
const LAMBS_TO_WIN=2;                 // solo se gana bebiendo
const LIVES=3;                        // tres cuerpos y se acabó
const START_AMMO=2, MAX_AMMO=2, AMMO_PICKUPS=8;
const SHOT_GAP=0.5;                   // medio segundo entre tiro y tiro
const LAMB_COUNT=3, LAMB_BACK=22;     // vuelven, si no la partida se atasca
const RESPAWN=5, DRINK_SECS=3.0;
const GAIT=[{sp:3.1,stride:.62,vol:.40,cut:1500,echo:.34,eR:3.8},
            {sp:1.3,stride:.95,vol:.14,cut:700,echo:.10,eR:1.9},
            {sp:1.05,stride:1.15,vol:.05,cut:480,echo:.045,eR:1.1}];
/* los tres modos del chillido: lo que ves y quién te oye */
const PULSE=[
 {n:"susurro", see:6.5, hear:4,  cd:0.95, vol:.10, f:2400},
 {n:"llamada", see:14,  hear:17, cd:2.10, vol:.26, f:1700},
 {n:"chillido",see:27,  hear:46, cd:3.80, vol:.55, f:1150}];
const AK=["goteo","corriente","reloj","crujido","viento","cañería","ratas","campana"];
const AGAP={goteo:2.1,corriente:3.4,reloj:1.05,crujido:4.2,viento:3.6,"cañería":2.8,ratas:3.1,campana:6.5};
const FLOORS=[{n:"madera",v:1.0},{n:"alfombra",v:.35},{n:"piedra",v:1.5}];

/* ══════════ mansión ══════════ */
let F=[null,null],stairs=[],holes=[],slabs=[],ammoSpots=[],spawns=[],props=[],trapdoors=[],spirals=[],nooks=[];
let hall=null,hallVoid=null,mainStair=null;
let propsSolid=[],propsStep=[];   // los que de verdad estorban, y los que se pisan
let occ=[null,null],GW=0,GH=0,GS=0.5;
function bsp(x0,z0,x1,z1,d,out){
  const w=x1-x0,h=z1-z0;
  const can=d<4&&(w>14||h>14)&&(d<2||R()<.78);
  if(!can||(w<15&&h<15)){out.push({x0:x0,z0:z0,x1:x1,z1:z1});return;}
  // de vez en cuando cortamos un pasillo en vez de dos salas
  if(d>=1&&d<=3&&R()<.3){
    const CW=2.4;
    if(w>=h&&w>CW+8){
      const c=x0+rf(.35,.65)*(w-CW);
      out.push({x0:c,z0:z0,x1:c+CW,z1:z1,corr:1});
      bsp(x0,z0,c,z1,d+1,out);bsp(c+CW,z0,x1,z1,d+1,out);return;}
    if(h>CW+8){
      const c=z0+rf(.35,.65)*(h-CW);
      out.push({x0:x0,z0:c,x1:x1,z1:c+CW,corr:1});
      bsp(x0,z0,x1,c,d+1,out);bsp(x0,c+CW,x1,z1,d+1,out);return;}
  }
  if(w>=h){const c=x0+rf(.38,.62)*w;bsp(x0,z0,c,z1,d+1,out);bsp(c,z0,x1,z1,d+1,out);}
  else{const c=z0+rf(.38,.62)*h;bsp(x0,z0,x1,c,d+1,out);bsp(x0,c,x1,z1,d+1,out);}
}
/* una sola estructura para las dos plantas: los muros maestros coinciden,
   como en una casa de verdad, y en medio el vestíbulo a doble altura */
function genLayout(){
  const hw=rf(12.5,14.5),hd=rf(10.0,11.5),hx=rf(-2.5,2.5),hz=rf(-1.5,1.5);
  const H={x0:hx-hw/2,x1:hx+hw/2,z0:hz-hd/2,z1:hz+hd/2,hall:1};
  const leaves=[H];
  bsp(-MW/2,-MH/2,H.x0,MH/2,0,leaves);      // ala oeste
  bsp(H.x1,-MH/2,MW/2,MH/2,0,leaves);       // ala este
  bsp(H.x0,-MH/2,H.x1,H.z0,0,leaves);       // fachada norte
  bsp(H.x0,H.z1,H.x1,MH/2,0,leaves);        // fachada sur
  return{leaves:leaves,hall:H};
}
function genFloor(f,LO){
  const leaves=LO.leaves;
  const rooms=leaves.map(function(r,i){return{x0:r.x0,z0:r.z0,x1:r.x1,z1:r.z1,id:i,f:f,corr:!!r.corr,
    hall:!!r.hall,cx:(r.x0+r.x1)/2,cz:(r.z0+r.z1)/2,floor:FLOORS[ri(0,2)],anchor:null,nb:[]};});
  const pairs=[];
  for(let i=0;i<rooms.length;i++)for(let j=i+1;j<rooms.length;j++){
    const A=rooms[i],B=rooms[j];
    if(Math.abs(A.x1-B.x0)<.01||Math.abs(B.x1-A.x0)<.01){
      const lo=Math.max(A.z0,B.z0),hi=Math.min(A.z1,B.z1);
      if(hi-lo>=DOOR_W+1.4)pairs.push({a:i,b:j,vert:true,x:(Math.abs(A.x1-B.x0)<.01?A.x1:B.x1),lo:lo,hi:hi});}
    if(Math.abs(A.z1-B.z0)<.01||Math.abs(B.z1-A.z0)<.01){
      const lo=Math.max(A.x0,B.x0),hi=Math.min(A.x1,B.x1);
      if(hi-lo>=DOOR_W+1.4)pairs.push({a:i,b:j,vert:false,z:(Math.abs(A.z1-B.z0)<.01?A.z1:B.z1),lo:lo,hi:hi});}
  }
  for(let i=pairs.length-1;i>0;i--){const j=ri(0,i),t=pairs[i];pairs[i]=pairs[j];pairs[j]=t;}
  const par=rooms.map(function(_,i){return i;});
  function find(a){while(par[a]!==a){par[a]=par[par[a]];a=par[a];}return a;}
  const used=[];
  for(let i=0;i<pairs.length;i++){const p=pairs[i],ra=find(p.a),rb=find(p.b);
    if(ra!==rb){par[ra]=rb;used.push(p);}}
  // nada de callejones: todo lo que pueda cerrar un circuito, lo cierra
  for(let i=0;i<pairs.length;i++)if(used.indexOf(pairs[i])===-1&&R()<.62)used.push(pairs[i]);
  const deg=rooms.map(function(){return 0;});
  for(let i=0;i<used.length;i++){deg[used[i].a]++;deg[used[i].b]++;}
  for(let i=0;i<pairs.length;i++){const p=pairs[i];
    if(used.indexOf(p)!==-1)continue;
    if(deg[p.a]<2||deg[p.b]<2){used.push(p);deg[p.a]++;deg[p.b]++;}}
  const doors=[];
  for(let i=0;i<used.length;i++){
    const p=used[i],A=rooms[p.a],B=rooms[p.b];
    // el vestíbulo se abre en arco; entre salones, arcos anchos; al pasillo, puerta
    let w=DOOR_W,arch=false;
    if(A.hall||B.hall){w=3.0;arch=true;}
    else if(A.corr||B.corr){if(R()<.3){w=2.2;arch=true;}}
    else if(R()<.42){w=2.5;arch=true;}
    else if(R()<.3)w=2.4;                                   // puerta de dos hojas
    if(p.hi-p.lo<w+1.2){w=DOOR_W;arch=false;}
    // centrado en el tramo: así los vanos de salas seguidas quedan en línea
    const mid=(p.lo+p.hi)/2,lim=(p.hi-p.lo)/2-w/2-.5;
    const c=mid+(lim>0?rf(-Math.min(lim,.45),Math.min(lim,.45)):0);
    doors.push({x:p.vert?p.x:c,z:p.vert?c:p.z,vert:p.vert,w:w,arch:arch,
                open:arch?true:R()<.55,f:f,mesh:null});
    rooms[p.a].nb.push(p.b);rooms[p.b].nb.push(p.a);}
  return{rooms:rooms,doors:doors,walls:[],anchors:[],y:f*FLOOR_H};
}
function buildWalls(fl){
  const seen={},walls=fl.walls;
  function mk(v,c,lo,hi){return v?{x0:c,z0:lo,x1:c,z1:hi}:{x0:lo,z0:c,x1:hi,z1:c};}
  function edge(v,c,lo,hi){
    const k=(v?"v":"h")+c.toFixed(2)+"|"+lo.toFixed(2)+"|"+hi.toFixed(2);
    if(seen[k])return;seen[k]=1;
    const ds=fl.doors.filter(function(d){
      if(d.vert!==v)return false;
      if(v)return Math.abs(d.x-c)<.01&&d.z>lo-.01&&d.z<hi+.01;
      return Math.abs(d.z-c)<.01&&d.x>lo-.01&&d.x<hi+.01;}).sort(function(a,b){return v?a.z-b.z:a.x-b.x;});
    let cur=lo;
    for(let i=0;i<ds.length;i++){const q=v?ds[i].z:ds[i].x,hw=(ds[i].w||DOOR_W)/2;
      if(q-hw>cur+.05)walls.push(mk(v,c,cur,q-hw));cur=q+hw;}
    if(hi>cur+.05)walls.push(mk(v,c,cur,hi));
  }
  for(let i=0;i<fl.rooms.length;i++){const r=fl.rooms[i];
    edge(true,r.x0,r.z0,r.z1);edge(true,r.x1,r.z0,r.z1);
    edge(false,r.z0,r.x0,r.x1);edge(false,r.z1,r.x0,r.x1);}
}
function subtract(rects,h){
  const out=[];
  for(let i=0;i<rects.length;i++){const r=rects[i];
    if(h.x1<=r.x0||h.x0>=r.x1||h.z1<=r.z0||h.z0>=r.z1){out.push(r);continue;}
    if(h.x0>r.x0)out.push({x0:r.x0,z0:r.z0,x1:h.x0,z1:r.z1});
    if(h.x1<r.x1)out.push({x0:h.x1,z0:r.z0,x1:r.x1,z1:r.z1});
    const lx=Math.max(r.x0,h.x0),rx=Math.min(r.x1,h.x1);
    if(h.z0>r.z0)out.push({x0:lx,z0:r.z0,x1:rx,z1:h.z0});
    if(h.z1<r.z1)out.push({x0:lx,z0:h.z1,x1:rx,z1:r.z1});}
  return out;
}
function buildOcc(){
  GW=Math.ceil((MW+4)/GS);GH=Math.ceil((MH+4)/GS);
  for(let f=0;f<2;f++){
    const g=new Uint8Array(GW*GH);
    const ws=F[f].walls;
    for(let i=0;i<ws.length;i++){
      const w=ws[i],len=Math.hypot(w.x1-w.x0,w.z1-w.z0),n=Math.ceil(len/(GS*0.5))+1;
      for(let k=0;k<=n;k++){
        const x=w.x0+(w.x1-w.x0)*k/n,z=w.z0+(w.z1-w.z0)*k/n;
        const gx=Math.round((x+MW/2+2)/GS),gz=Math.round((z+MH/2+2)/GS);
        if(gx>=0&&gx<GW&&gz>=0&&gz<GH)g[gz*GW+gx]=1;}}
    occ[f]=g;}
}
let occP=[null,null];
function buildPropOcc(){
  for(let f=0;f<2;f++)occP[f]=new Uint8Array(GW*GH);
  for(let i=0;i<props.length;i++){const q=props[i];
    if((q.hang&&!q.hide)||q.sy<.42)continue;
    const f=q.y>FLOOR_H-1.2?1:0,hh=Math.min(250,Math.round(q.sy*10));
    for(let x=q.x-q.sx/2;x<=q.x+q.sx/2+1e-6;x+=GS*.5)
      for(let z=q.z-q.sz/2;z<=q.z+q.sz/2+1e-6;z+=GS*.5){
        const gx=Math.round((x+MW/2+2)/GS),gz=Math.round((z+MH/2+2)/GS);
        if(gx<0||gx>=GW||gz<0||gz>=GH)continue;
        const k=gz*GW+gx;if(occP[f][k]<hh)occP[f][k]=hh;}}
}
/* ¿hay un mueble lo bastante alto entre estos dos puntos? */
function propsBetween(f,sx,sy,sz,lx,ly,lz){
  if(!occP[f])return false;
  const d=Math.hypot(lx-sx,lz-sz);if(d<.45)return false;
  const fy=f*FLOOR_H,n=Math.min(90,Math.ceil(d/.35));
  for(let i=1;i<n;i++){const t=i/n;
    const x=sx+(lx-sx)*t,z=sz+(lz-sz)*t,hy=sy+(ly-sy)*t;
    const gx=Math.round((x+MW/2+2)/GS),gz=Math.round((z+MH/2+2)/GS);
    if(gx<0||gx>=GW||gz<0||gz>=GH)continue;
    const hh=occP[f][gz*GW+gx];if(!hh)continue;
    if(fy+hh*.1>hy+.10)return true;}
  return false;}
function occAt(f,x,z){
  const gx=Math.round((x+MW/2+2)/GS),gz=Math.round((z+MH/2+2)/GS);
  if(gx<0||gx>=GW||gz<0||gz>=GH)return 1;
  return occ[f][gz*GW+gx];
}
function genMansion(seed){
  R=mulberry(seed);
  const LO=genLayout();
  F[0]=genFloor(0,LO);F[1]=genFloor(1,LO);
  stairs=[];holes=[];ammoSpots=[];spawns=[];
  hall=LO.hall;
  // el vestíbulo es de doble altura: arriba solo queda una galería que lo rodea
  const GALW=2.6;
  hallVoid={x0:hall.x0+GALW,x1:hall.x1-GALW,z0:hall.z0+GALW,z1:hall.z1-GALW,gal:1};
  holes.push(hallVoid);
  // y la escalera principal sube del vestíbulo a esa galería
  const msx=(hall.x0+hall.x1)/2,mlen=Math.min(5.4,hallVoid.z1-hallVoid.z0-.4);
  const msz0=hallVoid.z1-mlen;
  mainStair={x:msx,z0:msz0,len:mlen,w:2.0,steps:[],main:1};
  for(let i=0;i<12;i++)mainStair.steps.push({x:msx,z:msz0+i*(mlen/12),h:FLOOR_H*(i+1)/12,d:mlen/12,w:mainStair.w});
  stairs.push(mainStair);
  // las de servicio, en las alas y lejos de la principal
  const cand=F[0].rooms.filter(function(r){return !r.corr&&!r.hall&&(r.x1-r.x0)>5.0&&(r.z1-r.z0)>7.0;});
  for(let i=cand.length-1;i>0;i--){const j=ri(0,i),t=cand[i];cand[i]=cand[j];cand[j]=t;}
  const picked=[{cx:msx,cz:msz0+mlen/2}];
  for(let i=0;i<cand.length&&picked.length<3;i++){
    const r=cand[i];
    let ok=true;
    for(let k=0;k<picked.length;k++)
      if(Math.hypot(picked[k].cx-r.cx,picked[k].cz-r.cz)<13)ok=false;
    if(ok)picked.push(r);}
  for(let s=1;s<picked.length;s++){
    const r=picked[s],sx=r.cx,sz0=r.cz-2.6;
    const st={x:sx,z0:sz0,len:5.0,w:1.7,steps:[]};
    for(let i=0;i<12;i++)st.steps.push({x:sx,z:sz0+i*(st.len/12),h:FLOOR_H*(i+1)/12,d:st.len/12,w:st.w});
    stairs.push(st);
    holes.push({x0:sx-st.w/2-.15,x1:sx+st.w/2+.15,z0:sz0+st.len*.30,z1:sz0+st.len+.05});
  }
  // caracoles: se sube y se baja, ocupan poco y se oyen crujir. La otra ruta entre plantas.
  spirals=[];trapdoors=[];
  const scand=F[0].rooms.filter(function(r){return !r.corr&&!r.hall&&(r.x1-r.x0)>4.8&&(r.z1-r.z0)>4.8;});
  for(let i=scand.length-1;i>0;i--){const j=ri(0,i),t=scand[i];scand[i]=scand[j];scand[j]=t;}
  for(let i=0;i<scand.length&&spirals.length<2;i++){
    const r=scand[i];
    const sx=rf(r.x0+2.0,r.x1-2.0),sz=rf(r.z0+2.0,r.z1-2.0);
    let ok=true;
    for(let k=0;k<holes.length;k++)
      if(Math.abs((holes[k].x0+holes[k].x1)/2-sx)<9&&Math.abs((holes[k].z0+holes[k].z1)/2-sz)<9)ok=false;
    // el hueco tiene que caer dentro de una sala de arriba, no sobre un muro
    let above=null;
    for(let k=0;k<F[1].rooms.length;k++){const q=F[1].rooms[k];
      if(!q.corr&&sx-2.1>q.x0&&sx+2.1<q.x1&&sz-2.1>q.z0&&sz+2.1<q.z1)above=q;}
    if(!ok||!above)continue;
    spirals.push({x:sx,z:sz,turn:spirals.length%2?-1:1});
    trapdoors.push({x:sx,z:sz,air:0,sp:1});
    holes.push({x0:sx-1.5,x1:sx+1.5,z0:sz-1.5,z1:sz+1.5,spiral:1});}
  // trampillas: se cae por ellas, no se sube. Rutas rápidas con precio: el golpe al aterrizar.
  const tcand=F[1].rooms.filter(function(r){return !r.corr&&!r.hall&&(r.x1-r.x0)>4.2&&(r.z1-r.z0)>4.2;});
  for(let i=tcand.length-1;i>0;i--){const j=ri(0,i),t=tcand[i];tcand[i]=tcand[j];tcand[j]=t;}
  for(let i=0;i<tcand.length&&trapdoors.length<3;i++){
    const r=tcand[i];
    const tx=rf(r.x0+1.5,r.x1-1.5),tz=rf(r.z0+1.5,r.z1-1.5);
    let ok=true;
    for(let k=0;k<holes.length;k++)
      if(Math.abs(holes[k].x0-tx)<6&&Math.abs(holes[k].z0-tz)<6)ok=false;
    for(let k=0;k<trapdoors.length;k++)
      if(Math.hypot(trapdoors[k].x-tx,trapdoors[k].z-tz)<10)ok=false;
    if(!ok)continue;
    const hq={x0:tx-.85,x1:tx+.85,z0:tz-.85,z1:tz+.85,trap:1};
    trapdoors.push({x:tx,z:tz,air:0});
    holes.push(hq);}
  slabs=[{x0:-MW/2-.5,z0:-MH/2-.5,x1:MW/2+.5,z1:MH/2+.5}];
  for(let i=0;i<holes.length;i++)slabs=subtract(slabs,holes[i]);
  buildWalls(F[0]);buildWalls(F[1]);buildOcc();genProps();buildPropOcc();
  propsSolid=[];propsStep=[];
  for(let i=0;i<props.length;i++){const q=props[i];
    if(q.hang)continue;
    propsSolid.push(q);
    if(q.step)propsStep.push(q);}
  for(let f=0;f<2;f++){
    const fl=F[f],bag=[];
    for(let i=0;i<fl.rooms.length;i++)bag.push(AK[(i+f*3)%AK.length]);
    for(let i=bag.length-1;i>0;i--){const j=ri(0,i),t=bag[i];bag[i]=bag[j];bag[j]=t;}
    for(let i=0;i<fl.rooms.length;i++){
      let k=bag[i],tr=0;
      while(tr<12&&fl.rooms[i].nb.some(function(n){return fl.rooms[n].anchor===k;})){k=AK[ri(0,7)];tr++;}
      fl.rooms[i].anchor=k;
      fl.anchors.push({x:rf(fl.rooms[i].x0+.8,fl.rooms[i].x1-.8),y:fl.y+1.3+R()*1.2,
        z:rf(fl.rooms[i].z0+.8,fl.rooms[i].z1-.8),kind:k,next:0});
      // nadie aparece sobre un hueco ni encima de un mueble
      let spx=fl.rooms[i].cx,spz=fl.rooms[i].cz;
      for(let tr2=0;tr2<16&&(holeNear(spx,spz,1.8)||propAt(spx,spz,fl.y));tr2++){
        spx=rf(fl.rooms[i].x0+.9,fl.rooms[i].x1-.9);
        spz=rf(fl.rooms[i].z0+.9,fl.rooms[i].z1-.9);}
      if(!holeNear(spx,spz,1.8))spawns.push({x:spx,y:fl.y,z:spz});
    }
    const cs=[];for(let i=0;i<fl.rooms.length;i++)cs.push(i);
    for(let i=cs.length-1;i>0;i--){const j=ri(0,i),t=cs[i];cs[i]=cs[j];cs[j]=t;}
    for(let i=0;i<Math.min(AMMO_PICKUPS/2,cs.length);i++){
      const r=fl.rooms[cs[i]];
      let ax=0,az=0,ok2=false;
      for(let tr2=0;tr2<14&&!ok2;tr2++){
        ax=rf(r.x0+.9,r.x1-.9);az=rf(r.z0+.9,r.z1-.9);
        ok2=!holeNear(ax,az,.9)&&!propAt(ax,az,fl.y);}
      if(ok2)ammoSpots.push({x:ax,z:az,y:fl.y,taken:0,mesh:null});}
  }
}


/* ══════════ el labrado ══════════
   Los muebles dejan de ser cajas. Cada uno se compone de piezas —patas, cornisas,
   cajones, travesaños— que solo se dibujan: la colisión sigue siendo la caja
   sencilla de siempre, así que nada de esto puede engancharte. */
let deco=[];
function D(x,y,z,sx,sy,sz,m){deco.push({x:x,y:y,z:z,sx:sx,sy:sy,sz:sz,m:m||"w"});}
/* un mueble contra un muro puede estar girado 90°. W_ dibuja en coordenadas del
   propio mueble —a lo ancho, a lo alto, hacia su frente— y ya se ocupa del giro,
   para que los cajones y tiradores salgan siempre por la cara que se ve. */
let FA=1;
function faceAx(sx,sz){FA=(sz<=sx)?1:0;}
function W_(x,y,z,lat,yy,dep,lw,lh,ld,m){
  if(FA)D(x+lat,y+yy,z+dep, lw,lh,ld,m);
  else  D(x+dep,y+yy,z+lat, ld,lh,lw,m);
}
/* patas: cuatro, en las esquinas de una pieza */
function patas(x,y,z,sx,sz,h,g,m){
  const ax=sx/2-g,az=sz/2-g;
  for(let i=0;i<4;i++)
    D(x+((i&1)?ax:-ax), y+h/2, z+((i&2)?az:-az), g*2,h,g*2,m);
}
function armario(x,y,z,sx,sy,sz){
  faceAx(sx,sz);const W=FA?sx:sz,P=FA?sz:sx,pl=.13,co=.11;   // zócalo y cornisa
  W_(x,y,z, 0,pl/2,0, W,pl,P,"w");
  W_(x,y,z, 0,pl+(sy-pl-co)/2,0, W-.05,sy-pl-co,P-.03,"w");
  W_(x,y,z, 0,sy-co/2,0, W+.10,co,P+.09,"w");                // la cornisa vuela
  for(const t of [-1,1])                                     // dos hojas resaltadas
    W_(x,y,z, t*W*.25,pl+(sy-pl-co)/2,P/2-.005, W*.44,sy-pl-co-.10,.04,"w");
  for(const t of [-1,1])
    W_(x,y,z, t*.06*W,sy*.52,P/2+.03, .05,.11,.05,"m");      // tiradores
}
function aparador(x,y,z,sx,sy,sz){
  faceAx(sx,sz);const W=FA?sx:sz,P=FA?sz:sx,t=.07;
  patas(x,y,z,sx,sz,.22,.055,"w");
  W_(x,y,z, 0,.22+(sy-.22-t)/2,0, W-.04,sy-.22-t,P-.04,"w");
  W_(x,y,z, 0,sy-t/2,0, W+.09,t,P+.08,"w");                  // el sobre vuela
  const bh=sy-.22-t;
  for(let i=0;i<3;i++){const yy=.22+bh*(i+.5)/3;
    W_(x,y,z, 0,yy,P/2-.005, W-.11,bh/3-.055,.04,"w");       // cajones
    W_(x,y,z, 0,yy,P/2+.035, .24,.05,.05,"m");}              // y sus tiradores
}
function arcon(x,y,z,sx,sy,sz){
  faceAx(sx,sz);const W=FA?sx:sz,P=FA?sz:sx,t=.09;
  W_(x,y,z, 0,(sy-t)/2,0, W,sy-t,P,"w");
  W_(x,y,z, 0,sy-t/2,0, W+.05,t,P+.05,"w");                  // la tapa
  for(const q of [-1,1])W_(x,y,z, q*W*.28,(sy-t)/2,0, .05,sy-t,P+.02,"m");  // flejes
  W_(x,y,z, 0,sy-t,P/2, .10,.09,.05,"m");                    // cerradura
}
function vitrina(x,y,z,sx,sy,sz){
  faceAx(sx,sz);const W=FA?sx:sz,P=FA?sz:sx;
  W_(x,y,z, 0,.09,0, W,.18,P,"w");
  W_(x,y,z, 0,sy-.07,0, W+.08,.14,P+.07,"w");
  for(const q of [-1,1])W_(x,y,z, q*(W/2-.05),sy/2,0, .09,sy,P,"w");
  W_(x,y,z, 0,sy/2,-P/2+.03, W,sy,.05,"w");                  // el fondo
  for(let i=1;i<=3;i++)W_(x,y,z, 0,.18+(sy-.3)*i/4,0, W-.14,.035,P-.07,"w"); // baldas
}
function reloj(x,y,z,sx,sy,sz){
  faceAx(sx,sz);const W=FA?sx:sz,P=FA?sz:sx;
  W_(x,y,z, 0,.08,0, W+.06,.16,P+.05,"w");
  W_(x,y,z, 0,sy*.42,0, W,sy*.62,P,"w");
  W_(x,y,z, 0,sy*.80,0, W+.07,sy*.22,P+.04,"w");
  W_(x,y,z, 0,sy*.80,P/2, W*.6,W*.6,.03,"m");                // la esfera
  W_(x,y,z, 0,sy-.03,0, W*.5,.07,P*.7,"m");
  W_(x,y,z, 0,sy*.42,P/2-.01, W*.35,sy*.4,.02,"m");          // el cristal del péndulo
}
function consola(x,y,z,sx,sy,sz){
  faceAx(sx,sz);const W=FA?sx:sz,P=FA?sz:sx;
  patas(x,y,z,sx,sz,sy-.06,.04,"w");
  W_(x,y,z, 0,sy-.03,0, W+.07,.06,P+.06,"s");                // sobre de mármol
  W_(x,y,z, 0,sy*.62,0, W-.12,.05,P-.06,"w");
}
function banco(x,y,z,sx,sy,sz){
  faceAx(sx,sz);const W=FA?sx:sz,P=FA?sz:sx;
  patas(x,y,z,sx,sz,sy-.08,.05,"w");
  W_(x,y,z, 0,sy-.04,0, W,.08,P,"f");                        // el asiento, tapizado
  W_(x,y,z, 0,sy*.52,0, W-.14,.05,P-.09,"w");                // travesaño
}
function mesaLarga(x,y,z,sx,sy,sz){
  patas(x,y,z,sx,sz,sy-0.07,0.075,"w");
  D(x,y+sy-0.035,z, sx,0.07,sz,"w");
  D(x,y+sy-0.16,z, sx-0.22,0.06,sz-0.22,"w");        // el faldón
}
function silla(x,y,z,sx,sy,sz){
  patas(x,y,z,sx,sz,0.45,0.03,"w");
  D(x,y+0.47,z, sx,0.05,sz,"w");
  for(const s of [-1,1])D(x+s*(sx/2-0.03),y+0.75,z-sz/2+0.03, 0.05,0.56,0.05,"w");
  for(let i=0;i<3;i++)D(x,y+0.62+i*0.14,z-sz/2+0.03, sx-0.08,0.045,0.035,"w");
}
function sofa(x,y,z,sx,sy,sz,hz){
  const w=hz?sx:sz, d=hz?sz:sx;                       // largo y fondo según orientación
  patas(x,y,z,sx,sz,0.12,0.05,"w");
  D(x,y+0.30,z, sx,0.24,sz,"f");                      // el asiento, tapizado
  if(hz){
    D(x,y+0.66,z-sz/2+0.12, sx,0.70,0.22,"f");        // respaldo
    for(const s of [-1,1])D(x+s*(sx/2-0.10),y+0.50,z, 0.20,0.44,sz-0.10,"f");
  }else{
    D(x-sx/2+0.12,y+0.66,z, 0.22,0.70,sz,"f");
    for(const s of [-1,1])D(x,y+0.50,z+s*(sz/2-0.10), sx-0.10,0.44,0.20,"f");
  }
}
function camaDosel(x,y,z){
  D(x,y+0.14,z, 2.0,0.28,2.1,"w");                    // bastidor
  D(x,y+0.44,z, 1.86,0.22,1.96,"f");                  // colchón
  D(x,y+0.60,z+0.55, 1.86,0.10,0.86,"f");             // ropa revuelta
  patas(x,y,z,2.0,2.1,0.16,0.09,"w");
}
function cabecero(x,y,z,sx,sy,sz){
  D(x,y+sy*0.5,z, sx,sy,sz,"w");
  for(let i=0;i<5;i++)D(x-sx/2+sx*(i+0.5)/5, y+sy*0.58, z+sz/2, sx/9,sy*0.62,0.035,"w");
  D(x,y+sy-0.05,z, sx+0.07,0.10,sz+0.05,"w");
}
function biombo(x,y,z,sx,sy,sz,hz){
  const n=3;
  for(let i=0;i<n;i++){
    const f=(i-(n-1)/2);
    const ox=hz?f*(sx/n):0, oz=hz?((i%2)?0.05:-0.05):f*(sz/n);
    const jx=hz?0.05:0, jz=hz?0:0.05;
    D(x+ox+jz*0,y+sy/2,z+oz, hz?sx/n:sz*1.0, sy, hz?sz:sz, "f");
    D(x+ox,y+sy-0.04,z+oz, hz?sx/n:0.08, 0.08, hz?0.08:sz/n, "w");
    D(x+ox,y+0.04,z+oz,    hz?sx/n:0.08, 0.08, hz?0.08:sz/n, "w");
  }
}
function piano(x,y,z){
  D(x,y+0.62,z, 2.3,0.30,1.5,"w");
  D(x,y+0.92,z-0.10, 2.2,0.10,1.2,"w");
  patas(x,y,z,2.1,1.3,0.62,0.07,"w");
  D(x-1.0,y+0.80,z+0.62, 1.4,0.08,0.26,"m");          // el teclado
}
function chimenea(x,y,z,sx,sy,sz){
  for(const s of [-1,1])D(x+s*(sx/2-0.22),y+sy/2,z, 0.44,sy,sz,"s");
  D(x,y+sy-0.11,z, sx,0.22,sz+0.06,"s");              // dintel
  D(x,y+sy+0.06,z, sx+0.16,0.12,sz+0.14,"s");         // repisa
  D(x,y+0.05,z+sz*0.2, sx-0.7,0.10,sz*1.3,"s");       // solera
}
function estatua(x,y,z,sx,sy,sz){
  D(x,y+0.09,z, sx+0.12,0.18,sz+0.12,"s");
  D(x,y+sy/2,z, sx*0.75,sy-0.3,sz*0.75,"s");
  D(x,y+sy-0.07,z, sx+0.10,0.14,sz+0.10,"s");
}
function tarima(x,y,z,sx,sy,sz){
  D(x,y+sy-0.06,z, sx,0.12,sz,"w");
  D(x,y+(sy-0.12)/2,z, sx-0.14,sy-0.12,sz-0.14,"s");
  for(let i=0;i<3;i++)D(x,y+sy*(i+1)/4,z+sz/2, sx,0.04,0.05,"w");
}

/* atrezzo: lo que el eco encuentra además de las paredes */
function farFromDoors(fl,x,z,m){
  for(let i=0;i<fl.doors.length;i++){const d=fl.doors[i];
    if(Math.hypot(d.x-x,d.z-z)<m+((d.w||DOOR_W)-DOOR_W)/2)return false;}
  return true;}
function inStair(x,z,m){
  for(let i=0;i<stairs.length;i++){const st=stairs[i];
    if(x>st.x-st.w/2-m&&x<st.x+st.w/2+m&&z>st.z0-m&&z<st.z0+st.len+m+1.2)return true;}
  return false;}
function propAt(x,z,y){
  const L=propsSolid.length?propsSolid:props;
  for(let i=0;i<L.length;i++){const q=L[i];
    if(q.hang||Math.abs(q.y-y)>1.2)continue;
    if(Math.abs(q.x-x)<q.sx/2+.5&&Math.abs(q.z-z)<q.sz/2+.5)return true;}
  return false;}
function holeNear(x,z,m){
  for(let i=0;i<holes.length;i++){const h=holes[i];
    if(x>h.x0-m&&x<h.x1+m&&z>h.z0-m&&z<h.z1+m)return true;}
  return false;}
function spotFree(fl,f,x,z,w,dd){
  if(!farFromDoors(fl,x,z,1.5+(w||1.2)/2))return false;
  if(holeNear(x,z,1.2))return false;
  if(f===0&&inStair(x,z,1.2))return false;
  for(let i=0;i<props.length;i++){const o=props[i];
    if(o.hang||Math.abs(o.y-fl.y)>1)continue;
    if(Math.hypot(o.x-x,o.z-z)<(o.sx+w)/2+1.0)return false;}
  return true;}
// ¿tengo un mueble alto al lado detrás del que agazaparme?
function nearCover(){
  for(let i=0;i<props.length;i++){const q=props[i];
    if(!q.hide||Math.abs(q.y-me.y)>1.3)continue;

function decayMemory(){
  let any=false;
  const band=memData.length>>2,q=(band>>2)<<2;
  const from=decayBand*q,to=(decayBand===3)?memData.length:from+q;
  decayBand=(decayBand+1)&3;
  for(let i=from;i<to;i+=4){
    const r=memData[i],g=memData[i+1];
    if(r>0){memData[i]=r>DEC?r-DEC:0;any=true;}
    if(g>0){memData[i+1]=g>DEC?g-DEC:0;any=true;}}
  if(any)memTex.needsUpdate=true;}
function markMemory(px,pz,f,Rr){
  const N=200,step=GS;

  for(let a=0;a<N;a++){
    const ang=a/N*Math.PI*2,dx=Math.sin(ang),dz=Math.cos(ang);
    for(let s=0.4;s<Rr;s+=step){
      const x=px+dx*s,z=pz+dz*s;
      const u=Math.floor((x+MW/2+2)/(MW+4)*MEM_N),v=Math.floor((z+MH/2+2)/(MH+4)*MEM_N);

   La escena se dibuja a una textura; de ahí se extrae lo que brilla,

   Es lo que convierte un píxel encendido en un halo. */

function initPost(){

function sizePost(w,h){
  const o={minFilter:THREE.LinearFilter,magFilter:THREE.LinearFilter,format:THREE.RGBAFormat};
  const hw=Math.max(2,Math.floor(w/2)),hh=Math.max(2,Math.floor(h/2));

  rtMain=new THREE.WebGLRenderTarget(Math.max(2,w),Math.max(2,h),o);

function renderFrame(){
  if(!bloomOn||!rtMain){renderer.setRenderTarget(null);renderer.render(scene,camera);return;}
  try{
    renderer.setRenderTarget(rtMain);renderer.render(scene,camera);
    qMesh.material=matBright;matBright.uniforms.tDiffuse.value=rtMain.texture;
    renderer.setRenderTarget(rtA);renderer.render(qScene,qCam);

      matBlur.uniforms.tDiffuse.value=rtA.texture;

      matBlur.uniforms.tDiffuse.value=rtB.texture;
      matBlur.uniforms.uDir.value.set(0,(1.0+k)/rtA.height);

    matComp.uniforms.tScene.value=rtMain.texture;
    matComp.uniforms.tBloom.value=rtA.texture;
    renderer.setRenderTarget(null);renderer.render(qScene,qCam);

  for(let s=0;s<stairs.length;s++){const st=stairs[s];
    if(Math.abs(x-st.x)>st.w/2+RAD)continue;
    for(let i=0;i<st.steps.length;i++){const p=st.steps[i];

  let g=0;const st=stairTop(x,z);

    if(x<q.x-q.sx/2-.1||x>q.x+q.sx/2+.1||z<q.z-q.sz/2-.1||z>q.z+q.sz/2+.1)continue;
    const top=q.y+q.sy;
    if(top<=maxTop&&top>g)g=top;}

    for(let i=0;i<slabs.length;i++)if(inRect(slabs[i],x,z)){g=Math.max(g,FLOOR_H);break;}}

      else{const a=(q.x+q.sx/2)-L.x,b2=L.x-(q.x-q.sx/2),c2=(q.z+q.sz/2)-L.z,d3=L.z-(q.z-q.sz/2);

        else if(m===c2)L.z=q.z+q.sz/2+LRAD+.01;else L.z=q.z-q.sz/2-LRAD-.01;}

    for(let i=0;i<fl.walls.length;i++){const w=fl.walls[i];
      if(!segBlocks(w,L.x,L.z))continue;
      const v=Math.abs(w.x1-w.x0)<.01,lim=LRAD+WALL_T/2+.01;
      if(v){const off=L.x-w.x0;L.x=w.x0+(off>=0?lim:-lim);}

/* un sitio donde un cordero puede estar: ni dentro de un mueble ni sobre un hueco */
function lambSpot(sep,skip){
  const S=sep===undefined?15:sep;
  for(let tr=0;tr<60;tr++){
    const s2=spawns[Math.floor(Math.random()*spawns.length)];
    const x=s2.x+rf(-1,1),z=s2.z+rf(-1,1);
    if(holeNear(x,z,1.4))continue;
    if(blocked(x,z,s2.y))continue;

    let far=true,lim=S*(tr<40?1:0.55);

      if(Math.hypot(L.x-x,L.z-z)+Math.abs(L.y-s2.y)*2<lim)far=false;}
    if(!far)continue;
    return{x:x,y:s2.y,z:z};}

  return{x:s3.x,y:s3.y,z:s3.z};
}
function blocked(x,z,y){
  if(x<-MW/2+.2||x>MW/2-.2||z<-MH/2+.2||z>MH/2-.2)return true;
  for(let i=0;i<propsSolid.length;i++)if(propBlocks(propsSolid[i],x,z,y))return true;
  const fl=F[floorOf(y)];
  for(let i=0;i<fl.walls.length;i++)if(segBlocks(fl.walls[i],x,z))return true;
  for(let i=0;i<fl.doors.length;i++){const d=fl.doors[i];if(d.open)continue;
    if(segBlocks(doorSeg(d),x,z))return true;}
  return false;}
function depenetrate(){
  const fl=F[floorOf(me.y)];

  for(let i=0;i<fl.doors.length;i++)if(!fl.doors[i].open)segs.push(doorSeg(fl.doors[i]));
  for(let it=0;it<5;it++){
    let fixed=false;
    for(let i=0;i<propsSolid.length;i++){const q=propsSolid[i];
      if(!propBlocks(q,me.x,me.z,me.y))continue;
      const cx=clamp(me.x,q.x-q.sx/2,q.x+q.sx/2),cz=clamp(me.z,q.z-q.sz/2,q.z+q.sz/2);
      const dx=me.x-cx,dz=me.z-cz,d2=dx*dx+dz*dz;
      if(d2>=RAD*RAD)continue;
      if(d2>1e-7){const d=Math.sqrt(d2),pp=RAD-d+.003;me.x+=dx/d*pp;me.z+=dz/d*pp;}
      else{const l=me.x-(q.x-q.sx/2),r=(q.x+q.sx/2)-me.x,
             n=me.z-(q.z-q.sz/2),f2=(q.z+q.sz/2)-me.z,m=Math.min(l,r,n,f2);
        if(m===l)me.x=q.x-q.sx/2-RAD-.003;else if(m===r)me.x=q.x+q.sx/2+RAD+.003;
        else if(m===n)me.z=q.z-q.sz/2-RAD-.003;else me.z=q.z+q.sz/2+RAD+.003;}
      fixed=true;}
    for(let i=0;i<segs.length;i++){const w=segs[i];
      if(!segBlocks(w,me.x,me.z))continue;
      const v=Math.abs(w.x1-w.x0)<.01,lim=RAD+WALL_T/2+.003;
      if(v){const off=me.x-w.x0;me.x=w.x0+(off>=0?lim:-lim);}
      else{const off=me.z-w.z0;me.z=w.z0+(off>=0?lim:-lim);}

}
function roomAt(x,z,y){const fl=F[floorOf(y)];
  for(let i=0;i<fl.rooms.length;i++)if(inRect(fl.rooms[i],x,z))return fl.rooms[i];return null;}
function segInt(ax,az,bx,bz,cx,cz,dx,dz){
  const r1=bx-ax,r2=bz-az,s1=dx-cx,s2=dz-cz,den=r1*s2-r2*s1;
  if(Math.abs(den)<1e-9)return false;
  const t=((cx-ax)*s2-(cz-az)*s1)/den,u=((cx-ax)*r2-(cz-az)*r1)/den;
  return t>0&&t<1&&u>0&&u<1;}
function occlusion(sx,sy,sz,lx,ly,lz){
  let n=0;

  const fl=F[floorOf(ly)];
  for(let i=0;i<fl.walls.length;i++){const w=fl.walls[i];
    if(segInt(sx,sz,lx,lz,w.x0,w.z0,w.x1,w.z1))n++;if(n>5)return n;}
  for(let i=0;i<fl.doors.length;i++){const d=fl.doors[i];if(d.open)continue;
    const w=doorSeg(d);if(segInt(sx,sz,lx,lz,w.x0,w.z0,w.x1,w.z1))n++;}
  if(n<2&&propsBetween(floorOf(ly),sx,sy,sz,lx,ly,lz))n+=1;   // un armario también tapa
  return n;}
/* un cuerpo solo devuelve eco si nada se interpone: muro, puerta o mueble alto */
function bodySeen(x,y,z,lowered){
  if(floorOf(y)!==floorOf(me.y))return false;
  const f=floorOf(me.y),fl=F[f];
  const ey=me.y+(crouch?EYE_CROUCH:EYE),by=y+(lowered?.55:.95);
  for(let i=0;i<fl.walls.length;i++){const w=fl.walls[i];
    if(segInt(x,z,me.x,me.z,w.x0,w.z0,w.x1,w.z1))return false;}
  for(let i=0;i<fl.doors.length;i++){const d=fl.doors[i];if(d.open)continue;
    const w=doorSeg(d);if(segInt(x,z,me.x,me.z,w.x0,w.z0,w.x1,w.z1))return false;}
  return !propsBetween(f,x,by,z,me.x,ey,me.z);}
/* distancia a la pared más cercana en una dirección: para los retornos del eco */
function rayWall(x,z,dx,dz,f,max){
  for(let s=0.5;s<max;s+=0.4){const nx=x+dx*s,nz=z+dz*s;
    if(occAt(f,nx,nz))return s;}
  return max;}

/* ══════════ audio ══════════ */
let AC=null,master=null;
function initAudio(){if(AC)return;
  AC=new (window.AudioContext||window.webkitAudioContext)();
  master=AC.createGain();master.gain.value=.55;master.connect(AC.destination);}
function panAt(x,y,z){
  const p=AC.createPanner();p.panningModel="HRTF";p.distanceModel="inverse";
  p.refDistance=1.6;p.rolloffFactor=1.05;
  if(p.positionX){p.positionX.value=x;p.positionY.value=y;p.positionZ.value=z;}
  else p.setPosition(x,y,z);
  p.connect(master);return p;}
function worldSound(x,y,z,make){
  if(!AC)return;
  const ddx=x-me.x,ddz=z-me.z,ddy=y-me.y;
  if(ddx*ddx+ddz*ddz+ddy*ddy>52*52)return;     // inaudible: ni se monta
  const n=occlusion(x,y,z,me.x,me.y,me.z);
  const pan=AC.createPanner();pan.panningModel="HRTF";pan.distanceModel="inverse";
  pan.refDistance=1.6;pan.rolloffFactor=1.05;
  if(pan.positionX){pan.positionX.value=x;pan.positionY.value=y;pan.positionZ.value=z;}
  else pan.setPosition(x,y,z);
  const lp=AC.createBiquadFilter();lp.type="lowpass";
  lp.frequency.value=Math.max(200,18000/Math.pow(3.1,n));
  const g=AC.createGain();g.gain.value=Math.pow(.42,n);
  pan.connect(lp);lp.connect(g);g.connect(master);make(pan);}
function tone(f,d,v,ty,dest,when){
  if(!AC)return;const t0=AC.currentTime+(when||0);
  const o=AC.createOscillator(),g=AC.createGain();o.type=ty||"square";o.frequency.value=f;
  g.gain.setValueAtTime(.0001,t0);g.gain.exponentialRampToValueAtTime(Math.max(.0002,v),t0+.005);
  g.gain.exponentialRampToValueAtTime(.0001,t0+d);
  o.connect(g);g.connect(dest||master);o.start(t0);o.stop(t0+d+.03);}
let NOISE=null;
function noiseBuf(){
  if(NOISE)return NOISE;
  const len=Math.floor(AC.sampleRate*1.2);
  NOISE=AC.createBuffer(1,len,AC.sampleRate);
  const ch=NOISE.getChannelData(0);
  for(let i=0;i<len;i++)ch[i]=Math.random()*2-1;
  return NOISE;}
function noiseB(d,v,cut,dest,when){
  if(!AC)return;const t0=AC.currentTime+(when||0);
  // un solo buffer de ruido para todo el juego: antes cada golpe generaba miles de muestras
  const s=AC.createBufferSource();s.buffer=noiseBuf();s.loop=true;
  s.loopStart=0;s.loopEnd=1.2;
  const f=AC.createBiquadFilter();f.type="lowpass";f.frequency.value=cut;
  const g=AC.createGain();
  const vv=Math.max(.0002,v);
  g.gain.setValueAtTime(vv,t0);
  g.gain.exponentialRampToValueAtTime(vv*.0015,t0+Math.max(.03,d));
  s.connect(f);f.connect(g);g.connect(dest||master);
  s.start(t0,Math.random()*1.1);s.stop(t0+Math.max(.03,d)+.02);}

const me={id:"me",x:0,y:0,z:0,yaw:0,pitch:0,name:"",dead:false,respawnAt:0,

/* El sonido de otro no te enseña lo que ve él: te enseña lo que ESE sonido
   alcanza desde donde tú estás. Si hay un muro por medio, lo oyes apagado y
   no ves nada; si hay un vano, te llega un resto; en la misma sala, entero.
   Los murciélagos funcionan así: oyes la llamada del otro y los ecos que esa
   llamada devuelve de TU alrededor, no su mapa. */
function addEchoHeard(x,y,z,s,Rr,col){
  const n=occlusion(x,y,z,me.x,me.y,me.z);
  if(n>=2)return;                       // dos paredes o más: solo te llega el ruido
  if(n===1){s*=0.38;Rr*=0.5;}           // por un vano o una puerta: un resto

}
function addEcho(x,y,z,s,Rr,col){
  echoes.push({x:x,y:y,z:z,t:now(),s:s,R:Rr,c:col||[0.90,0.88,0.82]});
  if(echoes.length>MAX_ECHO)echoes.shift();}

/* ══════════ fotografías ══════════
   Un cuerpo no se ve: se fotografía. Cuando un chillido alcanza a alguien, su
   silueta queda revelada EN EL SITIO EXACTO DONDE ESTABA, y ahí se queda hasta
   apagarse. Si el otro se mueve, la foto no lo sigue: se despega de él y lo que
   te queda es una posición vieja. Un ruido flojo —un paso, una puerta— no
   revela ninguna figura: solo el halo del suelo donde sonó. */
const PHOTOS=6, PHOTO_MIN=0.45, PHOTO_LIFE=AFTERGLOW*BODY_GLOW+0.25;
let photos=[];
function photoMesh(){
  const m=bodyMat(1,.94,.88,true),g=new THREE.Group();
  const b=new THREE.Mesh(new THREE.BoxGeometry(.44,1.2,.3),m);b.position.y=.6;
  const h=new THREE.Mesh(new THREE.BoxGeometry(.26,.28,.26),m);h.position.y=1.4;
  g.add(b);g.add(h);g.visible=false;g.userData.mat=m;scene.add(g);
  return{mesh:g,mat:m,until:0};}
function clearPhotos(){for(let i=0;i<photos.length;i++){photos[i].mesh.visible=false;photos[i].until=0;}}
/* cuánto devuelve un cuerpo según cómo se mueva: es la misma escala de siempre,
   solo que ahora se congela en la foto en vez de seguir al cuerpo */
function bodyReturn(p,t){
  const mv=(t-(p.lastMove||0)<0.5),g=p.g|0;
  return mv?(g===2?0.08:(g===1?0.15:0.52)):(p.cr?0.14:0.30);}
function takePhoto(p,e,t){
  if(!photos.length)for(let i=0;i<PHOTOS;i++)photos.push(photoMesh());
  let P=photos[0],old=1e9;
  for(let i=0;i<photos.length;i++){
    if(photos[i].until<=t){P=photos[i];old=-1;break;}
    if(photos[i].until<old){old=photos[i].until;P=photos[i];}}
  P.mesh.position.set(p.x,p.y,p.z);
  P.mesh.rotation.y=p.yaw||0;
  P.mesh.scale.y=p.cr?.62:1;
  const k=bodyReturn(p,t);
  P.mat.uniforms.uTint.value.set(k,k*.94,k*.88);
  const U=P.mat.uniforms;                     // el único eco que revela esta foto
  U.uEchoPos.value[0].set(e.x,e.y,e.z);
  U.uEchoT.value[0]=e.t;U.uEchoS.value[0]=e.s;U.uEchoR.value[0]=e.R;
  U.uEchoC.value[0].set(e.c[0],e.c[1],e.c[2]);
  for(let i=1;i<MAX_ECHO;i++)U.uEchoS.value[i]=0;

function tickPhotos(t){
  for(let i=0;i<photos.length;i++)
    if(photos[i].mesh.visible&&t>photos[i].until)photos[i].mesh.visible=false;
  if(!running)return;
  for(let j=0;j<echoes.length;j++){const e=echoes[j];
    if(e.s<PHOTO_MIN)continue;                 // un eco flojo no dibuja una figura
    if(!e.ph)e.ph={};
    const r=(t-e.t)*ECHO_SPEED;
    for(const id in peers){const p=peers[id];
      if(p.x===undefined||p.dead||e.ph[id])continue;
      const dx=p.x-e.x,dy=(p.y+0.9)-e.y,dz=p.z-e.z;
      const d=Math.sqrt(dx*dx+dy*dy+dz*dz);
      if(r<d)continue;                         // la onda todavía no ha llegado hasta él
      e.ph[id]=1;                              // llegó: esta foto ya está tomada o descartada
      if(e.s*Math.max(0,1-d/e.R)<PHOTO_MIN)continue;   // le llegó demasiado floja
      if(!bodySeen(p.x,p.y,p.z,!!p.cr))continue;       // hay algo en medio
      takePhoto(p,e,t);}}
}

let peer=null,isHost=false,hostConn=null,myId="me",myCode="";

function hook(c){

function handle(m,from){
  if(isHost&&m.t!=="st"&&m.t!=="L"&&m.t!=="sc"&&m.t!=="claim"&&m.t!=="hb")send(m,from);
  if(m.t==="hb"){if(peers[m.id])peers[m.id].seen=now();return;}
  if(m.t==="st"){seed=m.seed;genMansion(seed);build3D();
    spawnPick=(m.spots&&m.spots[myId]!=null)?m.spots[myId]:null;startMatch();return;}
  if(m.t==="hi"){

    peers[m.id].name=m.name;peers[m.id].lambs=0;peers[m.id].kills=0;
    peers[m.id].lives=LIVES;peers[m.id].out=false;peers[m.id].seen=now();
    if(isHost&&phase!=="play"){
      note("Ha entrado "+String(m.name||"alguien").slice(0,10)+".");
      if(AC){tone(740,.09,.10,"sine");tone(990,.12,.08,"sine",null,.09);}}
    // al recién llegado le pasamos quién hay ya en la casa
    if(isHost&&from&&conns[from]){const c=conns[from];
      for(const id in peers)if(id!==m.id)c.send({t:"hi",id:id,name:peers[id].name});}
    if(phase!=="play")renderLobby();return;}
  if(m.t==="s"){
    let p=peers[m.id];if(!p)p=peers[m.id]={mesh:avatar()};
    p.x=m.x;p.y=m.y;p.z=m.z;p.yaw=m.yaw;p.dead=m.d;p.mv=m.mv;p.cr=m.cr;p.g=m.g|0;p.lastMove=m.mv?now():(p.lastMove||0);

function applyLambs(m){

function applyScores(m){
  for(const id in m.sc){

    else if(peers[id]){peers[id].lambs=m.sc[id].l;peers[id].kills=m.sc[id].k;

      peers[id].name=m.sc[id].n||peers[id].name;}}

function hostScores(){
  const sc={};

    if(!sc[id].o)vivos.push(id);}
  // si solo queda uno en pie y hay más de uno jugando, gana él
  if(!win&&vivos.length===1&&Object.keys(sc).length>1){const id=vivos[0];
    win={id:id,n:sc[id].n,l:sc[id].l,k:sc[id].k,last:1};}
  if(testMode)win=null;              // el test no tiene ganador: se corta tú
  send({t:"sc",sc:sc,win:win});
  if(win){winner=win;endMatch();}
}
function resolveClaim(m,from){
  if(m.k==="kill"){
    // un cuerpo ya caído no vuelve a contar: si no, dos tiros a la vez roban dos vidas
    if(m.victim===myId){ if(me.dead)return; dieNow(); }
    else{ const P=peers[m.victim];
      if(!P||P.dead||P.out)return;
      P.dead=true;
      P.lives=Math.max(0,(P.lives==null?LIVES:P.lives)-1);
      if(P.lives<=0)P.out=true;}
    const killer=m.by;
    if(killer===myId)me.kills++;else if(peers[killer])peers[killer].kills=(peers[killer].kills||0)+1;
    send({t:"ev",kind:"kill",by:killer,victim:m.victim,x:m.x,y:m.y,z:m.z});
    remoteEvent({kind:"kill",by:killer,victim:m.victim,x:m.x,y:m.y,z:m.z});
    hostScores();}
  if(m.k==="lambkill"){
    const L=lambs[m.i];
    if(!L||!L.alive)return;                  // ya estaba en el suelo
    L.alive=false;L.lastMove=now();hostLambs();return;}
  if(m.k==="lamb"){
    const L=lambs[m.i];
    if(!L||L.drained||L.alive)return;         // o se le adelantaron, o sigue de pie
    L.alive=false;L.drained=true;L.back=0;
    if(m.by===myId)me.lambs++;else if(peers[m.by])peers[m.by].lambs=(peers[m.by].lambs||0)+1;
    hostScores();hostLambs();}
}

/* ══════════ corderos ══════════ */
function hostInitLambs(){
  lambs.length=0;
  for(let i=0;i<LAMB_COUNT;i++){
    const s=lambSpot();
    lambs.push({x:s.x,y:s.y,z:s.z,alive:true,drained:false,back:0,stuck:0,
      mesh:lambMesh(),vx:0,vz:0,next:0,turn:0});}
}
function hostTickLambs(dt){
  for(let i=0;i<lambs.length;i++){
    const L=lambs[i];
    if(!L.alive){                      // uno seco vuelve a aparecer lejos, al rato
      if(L.drained){
        if(!L.back)L.back=now()+LAMB_BACK;
        else if(now()>L.back){
          const s=lambSpot(15,L);
          L.x=s.x;L.y=s.y;L.z=s.z;
          L.alive=true;L.drained=false;L.back=0;L.vx=0;L.vz=0;L.turn=0;L.stuck=0;hostLambs();}}
      continue;}
    L.turn-=dt;
    if(L.turn<=0){L.turn=1.2+Math.random()*2.4;
      const a=Math.random()*Math.PI*2;L.vx=Math.sin(a)*0.75;L.vz=Math.cos(a)*0.75;}
    lambPush(L);
    const nx=L.x+L.vx*dt,nz=L.z+L.vz*dt;
    let hit=false;
    if(!blocked(nx,L.z,L.y)&&!holeNear(nx,L.z,0.9)){if(nx!==L.x)L.lastMove=now();L.x=nx;}else hit=true;
    if(!blocked(L.x,nz,L.y)&&!holeNear(L.x,nz,0.9)){if(nz!==L.z)L.lastMove=now();L.z=nz;}else hit=true;
    if(hit){
      // girar un ángulo fijo, no otro al azar: así sale del rincón en vez de rebotar dentro
      const a=Math.atan2(L.vx,L.vz)+2.3+(Math.random()-.5)*0.6;
      L.vx=Math.sin(a)*0.75;L.vz=Math.cos(a)*0.75;L.turn=0.9+Math.random()*1.2;
      L.stuck=(L.stuck||0)+dt;
      if(L.stuck>4){                        // encallado de verdad: se muda de sitio
        const s2=lambSpot(15,L);L.x=s2.x;L.y=s2.y;L.z=s2.z;L.stuck=0;L.lastMove=now();hostLambs();}
    } else L.stuck=0;
  }
}
function hostLambs(){
  send({t:"L",l:lambs.map(function(L){return [L.x,L.y,L.z,L.alive?1:0,L.drained?1:0];})});
}

/* ══════════ modo TEST: maniquíes ══════════
   Cinco cuerpos que se pasean por la casa y no hacen nada más: ni disparan, ni
   beben, ni te buscan. Están para una sola cosa: mirar cómo se ve un cuerpo
   ajeno según cómo se mueva. Van por el mismo camino que un jugador de verdad
   —el mismo cuerpo, el mismo paso, la misma regla de visibilidad—, así que lo
   que ves aquí es exactamente lo que verás en una partida con gente. */
let npcs=[],testMode=false;
const NPC_PLAN=[
 {n:"normal",  g:0, cr:0, mov:1.00},   // paso corriente: devuelve 0,52, el más claro
 {n:"despacio",g:1, cr:0, mov:1.00},   // con Shift: 0,15, un rastro y poco más
 {n:"agachado",g:2, cr:1, mov:1.00},   // encogido y en marcha: 0,08, casi nada
 {n:"alterna", g:0, cr:0, mov:0.50},   // anda y se planta: ves el salto 0,52 → 0,30
 {n:"quieto",  g:0, cr:0, mov:0.12}];  // el bulto parado en un rincón: 0,30
function npcSpot(){
  for(let tr=0;tr<80;tr++){
    const s=spawns[Math.floor(Math.random()*spawns.length)];
    const x=s.x+rf(-1.2,1.2),z=s.z+rf(-1.2,1.2);
    if(holeNear(x,z,1.2)||blocked(x,z,s.y))continue;
    if(Math.hypot(x-me.x,z-me.z)<7&&Math.abs(s.y-me.y)<1)continue;   // no encima de ti
    return{x:x,y:s.y,z:z};}
  const s2=spawns[0];return{x:s2.x,y:s2.y,z:s2.z};
}
function spawnNPCs(){
  clearNPCs();testMode=true;
  for(let i=0;i<NPC_PLAN.length;i++){
    const P=NPC_PLAN[i],s=npcSpot(),id="npc"+i;
    peers[id]={mesh:avatar(),name:P.n,lambs:0,kills:0,lives:LIVES,out:false,seen:now(),
               x:s.x,y:s.y,z:s.z,yaw:0,g:P.g,cr:P.cr,dead:false,lastMove:0};
    npcs.push({id:id,plan:P,vx:0,vz:0,hold:0,acc:0,stuck:0,back:0,moving:true});}
  const tp=el("tpanel");if(tp)tp.classList.add("on");
  drawBoard();
}
function clearNPCs(){
  for(let i=0;i<npcs.length;i++){const P=peers[npcs[i].id];
    if(P&&P.mesh)scene.remove(P.mesh);
    delete peers[npcs[i].id];}
  npcs=[];testMode=false;
  const tp=el("tpanel");if(tp)tp.classList.remove("on");
}
function tickNPCs(dt,t){
  for(let i=0;i<npcs.length;i++){
    const N=npcs[i],P=peers[N.id];if(!P)continue;
    const PL=N.plan,G=GAIT[PL.g]||GAIT[0];
    if(P.dead){                                   // si le pegas un tiro, vuelve al rato
      if(!N.back)N.back=t+4;
      else if(t>N.back){const s=npcSpot();
        P.x=s.x;P.y=s.y;P.z=s.z;P.dead=false;P.lives=LIVES;P.out=false;N.back=0;}
      continue;}
    N.hold-=dt;
    if(N.hold<=0){                                // decidir: ¿ando o me planto?
      N.moving=(Math.random()<PL.mov);
      N.hold=N.moving?(1.8+Math.random()*3.4):(1.2+Math.random()*3.0);
      const a=Math.random()*Math.PI*2;N.vx=Math.sin(a);N.vz=Math.cos(a);}
    if(!N.moving)continue;
    const sp=G.sp,nx=P.x+N.vx*sp*dt,nz=P.z+N.vz*sp*dt;
    let hit=false,moved=false;
    if(!blocked(nx,P.z,P.y)&&!holeNear(nx,P.z,.9)){if(nx!==P.x)moved=true;P.x=nx;}else hit=true;
    if(!blocked(P.x,nz,P.y)&&!holeNear(P.x,nz,.9)){if(nz!==P.z)moved=true;P.z=nz;}else hit=true;
    if(hit){                                      // giro fijo, como los corderos: sale del rincón
      const a=Math.atan2(N.vx,N.vz)+2.3+(Math.random()-.5)*0.6;
      N.vx=Math.sin(a);N.vz=Math.cos(a);
      N.hold=Math.min(N.hold,0.9+Math.random());
      N.stuck+=dt;
      if(N.stuck>4){const s=npcSpot();P.x=s.x;P.y=s.y;P.z=s.z;N.stuck=0;}
    } else N.stuck=0;
    if(!moved)continue;
    P.lastMove=t;P.yaw=Math.atan2(N.vx,N.vz);
    const gy=groundAt(P.x,P.z,P.y+.55);
    if(gy>P.y-.02&&gy<P.y+.6)P.y=gy;
    N.acc+=sp*dt;                                 // y el paso, que es lo que lo delata
    if(N.acc>G.stride){N.acc=0;
      const rr=roomAt(P.x,P.z,P.y),fv=(rr?rr.floor.v:1)*nookMuffle(P.x,P.y,P.z);
      remoteEvent({kind:"step",x:P.x,y:P.y+.15,z:P.z,b:PL.g,q:fv},false);}
  }
}


/* ══════════ el cuerpo: respiración, corazón y tensión ══════════
   Nada de esto es información nueva: es tu cuerpo reaccionando a lo que YA
   has oído. El corazón no te dice dónde está nadie, te dice que tienes miedo. */
let breathNext=0,heartNext=0,tension=0,breathPhase=0,lastHeart=-9;
function breathe(exert,inhale){
  if(!AC)return;
  const v=(0.016+exert*0.055)*(inhale?1:0.8);
  noiseB(inhale?.45:.55, v, 260+exert*520);
}
function heartBeat(d){
  if(!AC)return;
  const v=0.045+d*0.13;
  tone(50,.11,v,"sine");
  tone(38,.17,v*0.62,"sine",null,.135);
  lastHeart=now();
}
/* un ruido cerca te encoge: sube la tensión y suelta un grave que se va solo */
function startle(x,y,z,k){
  const d=Math.hypot(x-me.x,z-me.z)+Math.abs(y-me.y)*1.4;
  if(d>15)return;
  if(occlusion(x,y,z,me.x,me.y,me.z)>=2)return;      // si no te ha llegado, no te asusta
  const w=(1-d/15)*k;
  if(w<=0.04)return;
  tension=Math.min(1,tension+w*0.85);
  if(AC&&w>0.25)tone(34+Math.random()*6,1.9,0.022+w*0.05,"sine");
}
function bodyTick(t,dtr,moving){
  tension=Math.max(0,tension-dtr*0.30);
  if(!running||me.dead)return;
  const g=me.gait|0;
  const exert=moving?(g===0?1:(g===1?0.45:0.28)):0.18;
  const rate=2.9-exert*1.35;                          // de 2,9 s a 1,5 s por ciclo
  if(t>breathNext){
    breathPhase=1-breathPhase;
    breathNext=t+rate*(breathPhase?0.42:0.58);
    breathe(exert,breathPhase);
  }
  // el miedo: lo que has oído cerca, la última vida, quedarte sin balas,
  // y sobre todo beber, que son tres segundos a cuerpo descubierto
  const danger=Math.max(0,Math.min(1,
    tension*0.60 + (me.lives===1?0.34:0) + (me.ammo<=0?0.12:0) + (me.drinking>0?0.62:0)));
  const hr=1.30-danger*0.80;                          // de 1,3 s a 0,5 s entre latidos
  if(t>heartNext){heartNext=t+hr;heartBeat(danger);}
}

/* ══════════ el pulso ══════════ */
function pulseLevel(){
  if(pulseCharge<0.33)return 0;
  if(pulseCharge<0.75)return 1;
  return 2;
}
function emitPulse(){
  const lv=pulseLevel(),P=PULSE[lv];
  pulseCD=P.cd;lastPulse=now();pulseCount++;
  const ap=pulseAperture;                       // 0 estrecho · 1 ancho
  const seeR=P.see*(ap<0.5?1.45-ap*0.5:1.0)*(ap>0.5?1.0-(ap-0.5)*0.25:1.0);
  const f=floorOf(me.y);
  // el chillido en sí
  if(AC){
    const o=AC.createOscillator(),g=AC.createGain();
    o.type="sawtooth";
    o.frequency.setValueAtTime(P.f*1.6,AC.currentTime);
    o.frequency.exponentialRampToValueAtTime(P.f*0.75,AC.currentTime+.1);
    g.gain.setValueAtTime(.0001,AC.currentTime);
    g.gain.exponentialRampToValueAtTime(P.vol*.5,AC.currentTime+.008);
    g.gain.exponentialRampToValueAtTime(.0001,AC.currentTime+.13);
    o.connect(g);g.connect(master);o.start();o.stop(AC.currentTime+.16);
    // retornos: el eco de las paredes, cada una a su tiempo
    const dirs=[-70,-35,0,35,70];
    const cp=Math.cos(me.pitch);
    for(let i=0;i<dirs.length;i++){
      const a=me.yaw+dirs[i]*Math.PI/180;
      const dx=Math.sin(a),dz=Math.cos(a);
      const d=rayWall(me.x,me.z,dx,dz,f,seeR);
      if(d>=seeR)continue;
      const delay=2*d/SOUND_MS;
      const pan=panAt(me.x+dx*d,me.y+1.2,me.z+dz*d);
      noiseB(.05,Math.min(.4,P.vol*0.9/(1+d*0.18)),Math.max(600,5200-d*110),pan,delay);
    }
  }
  addEcho(me.x,me.y+1.3,me.z,0.95,seeR,[0.95,0.86,0.72]);
  markMemory(me.x,me.z,f,Math.min(seeR,20));
  ev({kind:"pulse",x:me.x,y:me.y+1.3,z:me.z,lv:lv,see:seeR});
}

/* ══════════ eventos ══════════ */
function ev(e){e.t="ev";e.id=myId;send(e);remoteEvent(e,true);}
function flash(txt,cls){const f=el("flash");f.textContent=txt;f.className="flash on "+(cls||"");
  clearTimeout(flash._t);flash._t=setTimeout(function(){f.className="flash";},1500);}
function remoteEvent(m,mine){
  if(m.kind==="step"){
    const G=GAIT[m.b||0]||GAIT[0];
    const q=(typeof m.q==="number"&&isFinite(m.q))?Math.max(.15,Math.min(1.6,m.q)):1;
    const vol=(m.land?.55:G.vol)*q,cut=m.land?1200:G.cut;
    if(!mine){worldSound(m.x,m.y,m.z,function(D){noiseB(m.land?.14:.09,vol,cut,D);});
      startle(m.x,m.y,m.z,m.land?0.75:0.34*q);}
    addEchoHeard(m.x,m.y,m.z,(m.land?.7:G.echo)*q,(m.land?6.5:G.eR)*Math.min(1,q+.25));return;}
  if(m.kind==="door"){
    worldSound(m.x,m.y||1.2,m.z,function(D){noiseB(.16,.3,900,D);tone(m.o?220:140,.25,.10,"sawtooth",D);});
    addEchoHeard(m.x,m.y||1.2,m.z,.55,5);return;}
  if(m.kind==="shot"){
    if(!mine){worldSound(m.x,m.y,m.z,function(D){noiseB(.32,.6,2800,D);});startle(m.x,m.y,m.z,1.0);}
    else noiseB(.32,.5,2800);
    addEchoHeard(m.x,m.y,m.z,1.3,13,[1.0,0.72,0.55]);return;}
  if(m.kind==="pulse"){
    if(mine)return;
    const P=PULSE[m.lv];
    const d=Math.hypot(m.x-me.x,m.z-me.z)+Math.abs(m.y-me.y)*1.4;
    if(d<=P.hear){
      worldSound(m.x,m.y,m.z,function(D){
        const o=AC.createOscillator(),g=AC.createGain();
        o.type="sawtooth";
        o.frequency.setValueAtTime(P.f*1.6,AC.currentTime);
        o.frequency.exponentialRampToValueAtTime(P.f*.75,AC.currentTime+.1);
        g.gain.setValueAtTime(.0001,AC.currentTime);
        g.gain.exponentialRampToValueAtTime(P.vol*.45,AC.currentTime+.008);
        g.gain.exponentialRampToValueAtTime(.0001,AC.currentTime+.13);
        o.connect(g);g.connect(D);o.start();o.stop(AC.currentTime+.16);});
      // el pulso ajeno también te dibuja a ti, desde donde salió
      startle(m.x,m.y,m.z,0.35+0.30*m.lv);
      addEchoHeard(m.x,m.y,m.z,0.8,Math.min(m.see,P.hear),[0.72,0.80,0.98]);
      if(occlusion(m.x,m.y,m.z,me.x,me.y,me.z)===0)markMemory(m.x,m.z,floorOf(m.y),Math.min(m.see,14));
    }
    return;}
  if(m.kind==="bite"){
    if(!mine)startle(m.x,m.y,m.z,0.85);
    worldSound(m.x,m.y,m.z,function(D){noiseB(.12,.22,1400,D);tone(160,.2,.12,"sawtooth",D);});
    addEchoHeard(m.x,m.y,m.z,.5,4.5,[1.0,0.5,0.45]);return;}
  if(m.kind==="drink"){
    worldSound(m.x,m.y,m.z,function(D){noiseB(.5,.2,700,D);});
    addEchoHeard(m.x,m.y,m.z,.55,6,[1.0,0.45,0.42]);return;}
  if(m.kind==="kill"){
    if(m.victim===myId)dieNow();
    else if(m.by===myId)flash("Presa","good");
    addEchoHeard(m.x,m.y,m.z,1.0,9,[1.0,0.4,0.38]);
    if(!mine)worldSound(m.x,m.y,m.z,function(D){noiseB(.45,.45,900,D);tone(110,.5,.2,"sawtooth",D);});
    return;}
  if(m.kind==="lambdown"){
    worldSound(m.x,m.y,m.z,function(D){
      tone(300,.22,.20,"sawtooth",D);tone(150,.4,.14,"sine",D,.1);noiseB(.3,.16,700,D,.05);});
    addEchoHeard(m.x,m.y,m.z,.5,5,[1.0,0.45,0.42]);return;}
  if(m.kind==="bleat"){
    worldSound(m.x,m.y+.6,m.z,function(D){
      tone(430,.2,.32,"sawtooth",D);tone(392,.26,.21,"sawtooth",D,.17);
      tone(300,.3,.11,"sine",D,.17);});
    return;}                       // sin eco: el cordero suena, pero no te dibuja la sala
}

/* ══════════ acciones ══════════ */
function nearDoor(){let b=null,bd=1e9;
  const fl=F[floorOf(me.y)];
  for(let i=0;i<fl.doors.length;i++){const d=fl.doors[i];
    if(d.arch)continue;
    const q=Math.hypot(d.x-me.x,d.z-me.z);if(q<bd){bd=q;b=d;}}
  return bd<2.0?b:null;}
function toggleDoor(){const d=nearDoor();if(!d)return;
  d.open=!d.open;ev({kind:"door",x:d.x,y:me.y+1.2,z:d.z,o:d.open});}
/* lat: margen lateral en metros. Con él el disparo no tiene alcance, pero
   a cuarenta metros hay que estar apuntando a un cuerpo, no a un sector. */
function aimTarget(maxD,maxAng,lat){
  const f={x:Math.sin(me.yaw),z:Math.cos(me.yaw)};
  let best=null,bd=1e9,kind=null,idx=-1;
  function hits(x,z,L){
    const c=clamp(((x-me.x)/L)*f.x+((z-me.z)/L)*f.z,-1,1);
    if(c<=0)return false;                                   // está detrás
    if(lat)return L*Math.sqrt(Math.max(0,1-c*c))<lat;        // separación real del disparo
    return Math.acos(c)*180/Math.PI<maxAng;
  }
  for(const id in peers){const p=peers[id];
    if(p.dead||p.x===undefined)continue;
    if(Math.abs(p.y-me.y)>1.8)continue;
    const L=Math.hypot(p.x-me.x,p.z-me.z);
    if(L>maxD||L<.15)continue;
    if(hits(p.x,p.z,L)&&occlusion(me.x,me.y,me.z,p.x,p.y,p.z)===0&&L<bd){bd=L;best=id;kind="player";}}
  for(let i=0;i<lambs.length;i++){const L2=lambs[i];
    if(!L2||!L2.alive)continue;
    if(Math.abs(L2.y-me.y)>1.8)continue;
    const L=Math.hypot(L2.x-me.x,L2.z-me.z);
    if(L>maxD||L<.15)continue;
    if(hits(L2.x,L2.z,L)&&occlusion(me.x,me.y,me.z,L2.x,L2.y,L2.z)===0&&L<bd){bd=L;best=null;kind="lamb";idx=i;}}
  return{kind:kind,id:best,i:idx,d:bd};
}
function shoot(){
  if(me.dead||me.ammo<=0||shotCD>0)return;
  shotCD=SHOT_GAP;
  me.ammo--;drawAmmo();
  ev({kind:"shot",x:me.x,y:me.y+1.4,z:me.z});
  // sin límite de alcance: lo que decide es la puntería y que no haya nada en medio
  const t=aimTarget(999,0,0.55);
  if(t.kind==="player")claimKill(t.id);
  else if(t.kind==="lamb")claimLamb(t.i);
}
function bite(){
  if(me.dead)return;
  const t=aimTarget(1.7,55);
  if(!t.kind)return;
  ev({kind:"bite",x:me.x,y:me.y+1.2,z:me.z});
  if(t.kind==="player")claimKill(t.id);
  else claimLamb(t.i);
}
function claimKill(id){
  if(isHost)resolveClaim({k:"kill",by:myId,victim:id,x:me.x,y:me.y,z:me.z},myId);
  else send({t:"claim",k:"kill",by:myId,victim:id,x:me.x,y:me.y,z:me.z});
}
function claimLamb(i){
  // matar al cordero no puntúa: hay que beber.
  // y hay que avisar al anfitrión, o él lo sigue dando por vivo y te lo resucita.
  const L=lambs[i];
  if(L)L.alive=false;                                   // provisional, hasta que el anfitrión conteste

/* el anfitrión reparte los puntos de salida: nadie empieza al lado de nadie */
function spreadSpawns(ids){
  const out={},used=[];
  for(let k=0;k<ids.length;k++){
    let best=-1,bestD=-1;
    for(let i=0;i<spawns.length;i++){
      if(used.indexOf(i)!==-1)continue;
      let d;
      if(!used.length)d=Math.random()*1000;              // el primero, donde caiga
      else{d=1e9;
        for(let u=0;u<used.length;u++){const a=spawns[i],b=spawns[used[u]];
          d=Math.min(d,Math.hypot(a.x-b.x,a.z-b.z)+Math.abs(a.y-b.y)*1.5);}}
      if(d>bestD){bestD=d;best=i;}}
    if(best<0)best=Math.floor(Math.random()*spawns.length);
    used.push(best);out[ids[k]]=best;}
  return out;
}
/* al reaparecer, lo más lejos posible de quien siga vivo */
function farSpawn(){
  let best=null,bd=-1;
  for(let k=0;k<10;k++){
    const c=spawns[Math.floor(Math.random()*spawns.length)];
    let d=1e9,any=false;
    for(const id in peers){const p=peers[id];
      if(!p||p.dead||p.x===undefined)continue;
      any=true;d=Math.min(d,Math.hypot(p.x-c.x,p.z-c.z)+Math.abs(p.y-c.y)*1.5);}
    if(!any)return c;
    if(d>bd){bd=d;best=c;}}
  return best||spawns[Math.floor(Math.random()*spawns.length)];
}
